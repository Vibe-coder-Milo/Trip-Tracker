<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Trip Tracker Design A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. Revised mockup of design A with every feature of the current app
  plus the changes agreed in the grilling session. Sample data only; nothing saves anywhere.
  The black bar at the bottom is a mockup control (pretend date), not part of the design.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: navy header with tabs, full-width paper workspace below. Boarding Pass palette kept;
   type scale raised (body 17px) and secondary text darkened for readability. */
:root{
  color-scheme: light;
  --navy:#101b2d; --navy-2:#1a2a42; --navy-3:#24385a;
  --paper:#f5eedd; --paper-2:#ebe1c9; --card:#fffaf0;
  --brass:#c99a3d; --brass-ink:#8a6420; --teal:#2f6e66; --brick:#a34a2f;
  --ink:#1b2029; --muted:#4f4a3d; --faint:#7b745f;
  --line:rgba(16,27,45,.16); --line-strong:rgba(16,27,45,.3);
  --on-navy:#f1e9d4; --on-navy-muted:#b3bdcd;
  --good:#2f6e66; --warn:#a8641c; --bad:#a34a2f;
  --display:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --body:'Inter', system-ui, sans-serif;
  --scale:1;
}
html{ font-size:calc(100% * var(--scale)); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:1.0625rem; line-height:1.55; -webkit-text-size-adjust:100%; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--navy); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; }
h1,h2,h3{ font-family:var(--display); text-wrap:balance; margin:0; line-height:1.2; }
p{ margin:0; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:.8125rem; letter-spacing:.08em; text-transform:uppercase; color:var(--brass-ink); }
.muted{ color:var(--muted); }
.small{ font-size:.9375rem; }
.new{ display:inline-block; font-family:var(--mono); font-size:.6875rem; letter-spacing:.06em; text-transform:uppercase; background:var(--brass); color:var(--navy); padding:1px 7px; border-radius:999px; vertical-align:middle; font-weight:600; }

/* controls */
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > label, .field .lbl{ font-size:.9375rem; font-weight:600; color:var(--muted); }
.hint{ font-size:.875rem; color:var(--faint); }
.inp{ width:100%; min-height:48px; padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:10px; background:#fff; font-size:1.0625rem; }
.inp:focus{ border-color:var(--teal); outline:none; box-shadow:0 0 0 3px rgba(47,110,102,.18); }
textarea.inp{ min-height:52px; resize:vertical; line-height:1.45; }
.inp.num, input[type=time].inp{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.inp.slim{ min-height:42px; padding:6px 12px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:999px; border:1.5px solid var(--navy); background:var(--navy); color:var(--on-navy); font-weight:600; font-size:1rem; white-space:nowrap; }
.btn.ghost{ background:transparent; color:var(--navy); }
.btn.brass{ background:var(--brass); border-color:var(--brass); color:var(--navy); }
.btn.danger{ background:transparent; color:var(--bad); border-color:var(--bad); }
.btn.small{ min-height:40px; padding:6px 14px; font-size:.9375rem; }
.btn.wide{ width:100%; }
.linkbtn{ border:0; background:none; padding:4px 0; color:var(--teal); font-weight:600; text-decoration:underline; text-underline-offset:3px; min-height:36px; }
.dashed{ width:100%; min-height:52px; border:1.5px dashed var(--line-strong); background:transparent; border-radius:12px; font-weight:600; color:var(--muted); }
.x{ width:40px; height:40px; flex:0 0 auto; border-radius:50%; border:1.5px solid var(--line); background:transparent; font-size:1.125rem; color:var(--muted); display:grid; place-items:center; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:44px; padding:8px 16px; border-radius:999px; border:1.5px solid var(--line-strong); background:#fff; font-size:.9688rem; font-weight:500; display:inline-flex; align-items:center; gap:8px; }
.chip[aria-pressed="true"]{ background:var(--navy); border-color:var(--navy); color:var(--on-navy); }
.chip .ldot{ width:10px; height:10px; border-radius:50%; }
.seg{ display:inline-flex; flex-wrap:wrap; padding:4px; border-radius:16px; background:var(--paper-2); gap:4px; }
.seg button{ min-height:42px; padding:6px 16px; border-radius:12px; border:0; background:transparent; font-weight:600; font-size:.9688rem; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(16,27,45,.15); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:600px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; min-width:0; }
.card h2{ font-size:1.375rem; }
.stack{ display:flex; flex-direction:column; gap:16px; min-width:0; }
.row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.calc{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding:14px 16px; border-radius:12px; background:var(--paper-2); border:1.5px dashed var(--line-strong); }
.calc .big{ font-family:var(--mono); font-size:1.375rem; font-weight:600; color:var(--navy); }
.calc .sub{ font-size:.9688rem; color:var(--muted); }
.calc.empty .big{ color:var(--faint); font-weight:500; font-size:1.0625rem; font-family:var(--body); }
.empty{ text-align:center; padding:32px 16px; color:var(--muted); }

/* header */
.top{ background:var(--navy); color:var(--on-navy); }
.top-in, .tabs-in, .main, .foot-in{ max-width:1480px; margin:0 auto; padding-left:max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px)); }
.top-in{ display:flex; align-items:center; gap:16px 20px; flex-wrap:wrap; padding-block:18px 10px; }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.1875rem; }
.brand svg{ width:30px; height:30px; color:var(--brass); }
.tripname{ flex:1 1 280px; min-width:0; display:flex; flex-direction:column; gap:4px; }
.tripname input{ background:transparent; border:0; border-bottom:1.5px dashed transparent; color:var(--on-navy); font-family:var(--display); font-weight:700; font-size:1.5rem; padding:2px 0; width:100%; }
.tripname input:hover, .tripname input:focus{ border-bottom-color:var(--navy-3); outline:none; }
.stats{ display:flex; gap:6px 22px; flex-wrap:wrap; font-size:.9375rem; color:var(--on-navy-muted); }
.stats b{ color:var(--on-navy); font-family:var(--mono); font-weight:500; margin-left:6px; }
.top-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.sync{ display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:6px 14px 6px 12px; border-radius:999px; border:1.5px solid var(--navy-3); background:transparent; color:var(--on-navy); font-size:.9375rem; text-align:left; }
.sync .dot{ width:10px; height:10px; border-radius:50%; background:#5fb3a6; flex:0 0 auto; }
.sync[data-s="saving"] .dot{ background:var(--brass); animation:pulse 1s infinite; }
.sync[data-s="offline"] .dot{ background:#e0a85a; }
.sync[data-s="expiring"]{ border-color:#e0a85a; }
.sync[data-s="expiring"] .dot{ background:#e0a85a; }
.sync[data-s="stopped"]{ border-color:#e08a6e; background:rgba(224,138,110,.12); }
.sync[data-s="stopped"] .dot{ background:#e08a6e; }
@keyframes pulse{ 50%{ opacity:.3; } }
.iconbtn{ min-height:44px; min-width:44px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--navy-3); background:transparent; color:var(--on-navy); font-weight:600; }
.tabs-in{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.tab{ min-height:52px; padding:10px 16px; border:0; background:transparent; color:var(--on-navy-muted); font-weight:600; font-size:1.0313rem; border-bottom:3px solid transparent; white-space:nowrap; }
.tab[aria-current="page"]{ color:var(--on-navy); border-bottom-color:var(--brass); }
.main{ padding-block:26px 140px; display:flex; flex-direction:column; gap:24px; }
@media (max-width:600px){ .top-in,.tabs-in,.main,.foot-in{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); } .card{ padding:18px; border-radius:14px; } .tripname input{ font-size:1.25rem; } }
.foot{ border-top:1px solid var(--line); }
.foot-in{ padding-block:18px 120px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; font-size:.9375rem; color:var(--muted); }

/* home */
.hero{ background:var(--navy); color:var(--on-navy); border-radius:22px; padding:28px; display:flex; flex-direction:column; gap:20px; }
.hero h1{ font-size:clamp(1.75rem, 3.4vw, 2.5rem); font-weight:700; }
.hero .eyebrow{ color:var(--brass); }
.legend{ display:flex; gap:18px; flex-wrap:wrap; font-size:.9375rem; }
.legend span{ display:inline-flex; align-items:center; gap:8px; }
.legend i{ width:12px; height:12px; border-radius:50%; display:inline-block; }
.world{ position:relative; width:100%; }
.world svg{ display:block; width:100%; height:auto; }
.world .lab{ position:absolute; transform:translate(8px,-50%); white-space:nowrap; font-size:.8125rem; font-weight:600; pointer-events:none; line-height:1.1; color:var(--on-navy); text-shadow:0 1px 2px var(--navy), 0 0 6px var(--navy); }
.world .lab.l{ transform:translate(calc(-100% - 8px),-50%); }
.world .lab.b{ transform:translate(-50%, 9px); }
.world .lab.hl{ font-size:.9375rem; color:var(--brass); }
@media (max-width:700px){ .world .lab:not(.hl){ display:none; } }
.citydot{ cursor:pointer; }
.hstats{ display:grid; grid-template-columns:repeat(4,1fr); margin:0; border-top:1px solid var(--navy-3); padding-top:18px; }
.hstats div{ padding:0 18px; border-left:1px solid var(--navy-3); }
.hstats div:first-child{ border-left:0; padding-left:0; }
.hstats dt{ font-size:.875rem; color:var(--on-navy-muted); }
.hstats dd{ margin:2px 0 0; font-family:var(--mono); font-size:1.625rem; font-weight:600; }
@media (max-width:640px){ .hstats{ grid-template-columns:1fr 1fr; row-gap:14px; } .hstats div:nth-child(3){ border-left:0; padding-left:0; } .hero{ padding:20px; } }
.passes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap:16px; }
.pass{ display:grid; grid-template-columns:1fr auto; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:0; overflow:hidden; color:var(--ink); }
.pass .pm{ padding:16px 20px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.pass .pm b{ font-family:var(--display); font-size:1.1875rem; }
.pass .pm .cities{ color:var(--muted); font-size:.9688rem; }
.pass .stub{ padding:16px 20px; border-left:2px dashed var(--line-strong); display:flex; flex-direction:column; justify-content:space-between; gap:6px; background:var(--paper); min-width:140px; }
.pass .stub .route{ font-family:var(--mono); font-weight:600; }
.pass .stub small{ font-family:var(--mono); color:var(--muted); font-size:.875rem; }
.pass.cur{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(201,154,61,.3); }
.pass.cur .stub{ background:var(--navy); color:var(--on-navy); border-left-color:var(--brass); }
.pass.cur .stub small{ color:var(--on-navy-muted); }
.tag{ display:inline-flex; align-self:flex-start; padding:3px 10px; border-radius:999px; font-family:var(--mono); font-size:.8125rem; letter-spacing:.04em; text-transform:uppercase; background:var(--paper-2); color:var(--muted); }
.tag.up{ background:var(--brass); color:var(--navy); }
.tag.maponly{ background:#e3ece9; color:var(--teal); }

/* today */
.today-grid{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width:900px){ .today-grid{ grid-template-columns:1fr; } }
.nextup{ background:var(--navy); color:var(--on-navy); border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:8px; }
.nextup .eyebrow{ color:var(--brass); }
.nextup .t{ font-family:var(--mono); font-size:2.25rem; font-weight:600; line-height:1; }
.nextup p{ font-size:1.25rem; }
.nextup small{ color:var(--on-navy-muted); font-size:1rem; }
.tl{ list-style:none; margin:0; padding:0; position:relative; }
.tl::before{ content:""; position:absolute; left:79px; top:12px; bottom:12px; width:2px; background:var(--line-strong); }
.tl li{ display:grid; grid-template-columns:64px 1fr; gap:30px; padding:12px 0; position:relative; }
.tl li::after{ content:""; position:absolute; left:74px; top:21px; width:12px; height:12px; border-radius:50%; background:var(--paper); border:2px solid var(--teal); }
.tl li.past{ color:var(--faint); }
.tl li.past::after{ background:var(--teal); }
.tl li.now::after{ background:var(--brass); border-color:var(--brass); box-shadow:0 0 0 4px rgba(201,154,61,.3); }
.tl .t{ font-family:var(--mono); font-weight:600; color:var(--teal); text-align:right; }
.stay{ display:flex; flex-direction:column; gap:6px; padding:18px; border-radius:16px; background:var(--paper-2); }
.stay b{ font-family:var(--display); font-size:1.1875rem; }
.stay .addr{ font-size:1.125rem; }

/* overview */
.ov-sum{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:24px; align-items:center; }
@media (max-width:800px){ .ov-sum{ grid-template-columns:1fr; } }
.total{ font-family:var(--mono); font-size:clamp(2rem,4vw,2.75rem); font-weight:600; color:var(--navy); line-height:1.1; }
.bars{ display:flex; flex-direction:column; gap:12px; }
.bar{ display:grid; grid-template-columns:140px 1fr auto; gap:12px; align-items:center; font-size:.9688rem; }
.bar .track{ height:12px; background:var(--paper-2); border-radius:6px; overflow:hidden; }
.bar .fill{ display:block; height:100%; border-radius:6px; }
.bar .v{ font-family:var(--mono); min-width:96px; text-align:right; }
@media (max-width:480px){ .bar{ grid-template-columns:110px 1fr; } .bar .v{ grid-column:2; text-align:left; } }
.ov-list{ display:flex; flex-direction:column; gap:14px; }
.ov-card{ display:grid; grid-template-columns:76px minmax(0,1fr); background:var(--card); border:1.5px solid var(--line); border-radius:18px; overflow:hidden; transition:border-color .15s, background .15s; }
.ov-card.drop-target{ border-color:var(--teal); background:#eef5f2; }
.ov-stub{ background:var(--navy); color:var(--on-navy); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:12px 6px; border-right:2px dashed rgba(241,233,212,.35); }
.ov-stub small{ font-family:var(--mono); font-size:.75rem; color:var(--brass); letter-spacing:.08em; }
.ov-stub b{ font-family:var(--mono); font-size:1.625rem; }
.ov-stub{ justify-content:space-between; }
.mv{ width:44px; height:40px; border-radius:10px; border:1.5px solid rgba(241,233,212,.35); background:transparent; color:var(--on-navy); font-size:.875rem; }
.mv:disabled{ opacity:.25; cursor:default; }
.btn:disabled{ opacity:.4; cursor:default; }
.ov-body{ padding:16px 20px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.ov-head{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
.ov-head h3{ font-size:1.25rem; }
.ov-head .d{ font-family:var(--mono); color:var(--muted); font-size:.9375rem; }
.ov-meta{ display:flex; flex-direction:column; gap:2px; font-size:.9688rem; color:var(--muted); }
.ov-chips{ display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-items:center; }
.pchip{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:6px 14px 6px 6px; border-radius:999px; border:1.5px solid var(--line-strong); background:#fff; font-size:.9688rem; font-weight:500; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; position:relative; }
.pchip .num{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-family:var(--mono); font-size:.8125rem; font-weight:600; }
.pchip.dragging-src{ opacity:.35; }
.pchip.drop-before::before, .pchip.drop-after::after{ content:""; position:absolute; top:4px; bottom:4px; width:4px; border-radius:2px; background:var(--teal); }
.pchip.drop-before::before{ left:-7px; }
.pchip.drop-after::after{ right:-7px; }
.dragghost{ position:fixed; z-index:90; pointer-events:none; margin:0; box-shadow:0 10px 24px rgba(16,27,45,.3); transform:rotate(-2deg); cursor:grabbing; }
.ov-times{ display:flex; flex-direction:column; gap:2px; font-size:.9688rem; }
.ov-times .t{ font-family:var(--mono); color:var(--teal); font-weight:600; margin-right:10px; }
.ov-note{ font-size:.9688rem; }
.ov-empty{ color:var(--faint); font-size:.9375rem; font-style:italic; }
.tip{ font-size:.9375rem; color:var(--muted); background:var(--paper-2); padding:10px 14px; border-radius:10px; }

/* map tab */
.map-grid{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; }
@media (max-width:980px){ .map-grid{ grid-template-columns:1fr; } }
.tripmap{ position:relative; width:100%; overflow:hidden; border-radius:16px; border:1px solid var(--line); }
.tripmap svg{ display:block; width:100%; height:100%; }
.tripmap.picking svg{ cursor:crosshair; }
.mapnote{ position:absolute; left:10px; bottom:10px; font-size:.8125rem; color:var(--muted); background:rgba(255,250,240,.9); padding:4px 10px; border-radius:8px; pointer-events:none; }
.pickbar{ position:absolute; left:10px; right:10px; top:10px; background:var(--navy); color:var(--on-navy); padding:10px 14px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.pin{ cursor:pointer; }
.pulse{ animation:ring 1.3s ease-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes ring{ 0%{ opacity:.9; transform:scale(.6);} 100%{ opacity:0; transform:scale(2.4);} }
@media (prefers-reduced-motion:reduce){ .pulse, .sync .dot{ animation:none !important; } }
.popup{ background:var(--card); border:1.5px solid var(--navy); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
.popup b{ font-family:var(--display); font-size:1.125rem; }
.unplaced{ display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:14px; background:#fff7ec; border:1.5px solid #e5c38f; }

/* itinerary */
.daytabs{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
.daytab{ flex:0 0 auto; min-width:128px; text-align:left; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); display:flex; flex-direction:column; gap:2px; }
.daytab small{ font-family:var(--mono); font-size:.8125rem; color:var(--muted); }
.daytab b{ font-size:1rem; }
.daytab[aria-current="true"]{ border-color:var(--navy); background:var(--navy); color:var(--on-navy); }
.daytab[aria-current="true"] small{ color:var(--brass); }
.daytab.add{ min-width:96px; align-items:center; justify-content:center; border-style:dashed; font-weight:600; color:var(--muted); }
.it-grid{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width:980px){ .it-grid{ grid-template-columns:1fr; } }
.daycard{ display:grid; grid-template-columns:96px minmax(0,1fr); background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
.daycard .stubv{ background:var(--navy); color:var(--on-navy); padding:18px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; border-right:2px dashed rgba(241,233,212,.35); }
.daycard .stubv small{ font-family:var(--mono); color:var(--brass); letter-spacing:.1em; font-size:.75rem; }
.daycard .stubv b{ font-family:var(--mono); font-size:2rem; line-height:1; }
.daycard .body{ padding:22px; display:flex; flex-direction:column; gap:20px; min-width:0; }

  });
  if(extra){ const [ex, ey] = J(extra.lon, extra.lat); s += `<circle class="pulse" cx="${ex}" cy="${ey}" r="${R * 1.3}" fill="none" stroke="#c99a3d" stroke-width="3" vector-effect="non-scaling-stroke"/><circle cx="${ex}" cy="${ey}" r="${R}" fill="#c99a3d" stroke="#101b2d" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono" font-weight="700" font-size="${R}" fill="#101b2d">+</text>`; }
  s += `</svg>`;
  return `<div class="tripmap ${picking ? 'picking' : ''}" style="aspect-ratio:${aspect}">${s}<span class="mapnote">Mockup map · the real app keeps your Google / OpenStreetMap map</span></div>`;
}

const EX = {
  short: 'https://maps.app.goo.gl/JJPYF9HCxvhZecEz7?g_st=ic',
  long: 'https://www.google.com/maps/place/Ichiran+Shibuya/@35.6612,139.7016,17z/data=!3m1!4b1!4m6!3m5!1s0x60188ca8b7c0a2a9:0x1!8m2!3d35.6611!4d139.7017',
};
function parseMaps(text){
  const t = (text || '').trim(); if(!t) return { kind:'empty' };
  const num = '(-?\\d{1,3}\\.\\d+)';
  const m = t.match(new RegExp('!3d' + num + '!4d' + num)) || t.match(new RegExp('@' + num + ',' + num)) || t.match(new RegExp('[?&](?:q|query|ll|destination|center)=' + num + ',\\s*' + num));
  const nm = t.match(/\/maps\/place\/([^/@?]+)/);
  const name = nm ? decodeURIComponent(nm[1].replace(/\+/g, ' ')) : 'Pinned place';
  if(m) return { kind:'coords', lat:+m[1], lon:+m[2], name, via:'link' };
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(t)){
    // Mockup stand-in for the Apps Script helper: pretend it expanded the short link.
    return S.helperSet ? { kind:'coords', lat:35.6611, lon:139.7017, name:'Ichiran Shibuya', via:'helper' } : { kind:'nohelper' };
  }
  return { kind:'unknown' };
}
function linkResHTML(){
  const r = parseMaps(S.link);
  if(r.kind === 'empty') return `<p class="small muted">In Google Maps on your iPad, tap Share → Copy link, then paste it here. Full links and short maps.app.goo.gl links both work.</p>`;
  if(r.kind === 'coords') return `<div class="linkres ok"><p class="eyebrow">${r.via === 'helper' ? 'Short link opened by your helper' : 'Location read from the link'}</p><h4>${esc(r.name)}</h4><p class="small mono muted">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</p>${r.via === 'helper' ? '<p class="small muted">Mockup: every short link shows this sample place.</p>' : ''}</div>`;
  if(r.kind === 'nohelper') return `<div class="linkres warn"><h4>Short links need the link helper</h4><p class="small">Set it up once in Settings. Until then, search by name instead.</p></div>`;
  return `<div class="linkres warn"><h4>That doesn't look like a Google Maps link</h4><p class="small">Copy the link from Google Maps' Share button and paste it here.</p></div>`;
}

  if(m === 'pax'){ const u = parseFloat(d.unit), q = parseInt(d.qty) > 0 ? parseInt(d.qty) : 1; if(!(u > 0)) return { empty:true, big:'Enter the price for one person' }; return { big:`${fmt(d.cur, u * q)} total`, sub:`${q} ${q === 1 ? 'person' : 'people'} × ${fmt(d.cur, u)}${d.cur !== tb ? ` · ≈ ${fmt(tb, conv(d.cur, tb, u * q))}` : ''}` }; }

    let found = null;
    if(S.addMode === 'search'){ found = SEARCH.find(s => s.name === S.picked); if(!found){ toast('Pick a result from the list so it lands on the map.'); return; } }
    else { const r = parseMaps(S.link); if(r.kind !== 'coords'){ toast('Paste a Google Maps link first.'); return; } found = { name:r.name, addr:'Added from a Google Maps link', lat:r.lat, lon:r.lon }; }
    if(t === 'hotel'){
      const a = S.hFrom ?? di, b = S.hTo ?? di; const lo = Math.min(a, b), hi = Math.max(a, b);
      for(let j = lo; j <= hi; j++) TRIP.days[j].places.splice(TRIP.days[j].places.filter(p => p.type === 'flight').length, 0, P({ type:'hotel', name:found.name, addr:found.addr, lat:found.lat, lon:found.lon, note:S.addNote }));
      toast(`Added ${found.name} to Day ${lo + 1}${hi > lo ? '–' + (hi + 1) : ''}`);
    } else {
      TRIP.days[di].places.push(act(S.addCat, found.name, found.addr, found.lat, found.lon, S.addNote));
      toast(`Added ${found.name} to Day ${di + 1}`);
    }
    S.q = ''; S.picked = null; S.link = '';
  }
  S.addNote = ''; S.wiki = null; S.dialog = null; if(S.screen === 'itinerary') S.day = di; render();
}
function saveExpense(){
  const d = S.draft; const m = catOf(d.cat).mode;
  const e = S.editing ? EXPENSES.find(x => x.id === S.editing) : { id:uid() };
  const o = { cat:d.cat, desc:d.desc || d.cat, date:d.date, cur:d.cur };
  if(m === 'pax'){ if(!(parseFloat(d.unit) > 0)){ toast('Enter the price for one person.'); return; } Object.assign(o, { unit:parseFloat(d.unit), qty:parseInt(d.qty) || 1, total:undefined, nights:undefined }); }
  else { if(!(parseFloat(d.total) > 0)){ toast('Enter the amount.'); return; } Object.assign(o, { total:parseFloat(d.total), nights:m === 'nights' ? (parseInt(d.nights) || null) : undefined, unit:undefined, qty:undefined }); }
  Object.assign(e, o); if(!S.editing) EXPENSES.unshift(e);
  toast(`${S.editing ? 'Saved' : 'Added'} ${e.desc} · ${fmt(e.cur, expTotal(e))}`);
  S.editing = null; S.draft = { cat:d.cat, desc:'', date:d.date, cur:TRIP.localCur, total:'', nights:'', unit:'', qty:'2' }; render();
}
function confirmBox(title, body, yes, fn){ S.confirm = { title, body, yes, fn }; S.dialog = 'confirm'; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.dataset.act === '') return;
  const a = el.dataset.act; if(a === 'closebg' && e.target !== el) return;
  switch(a){
    case 'pretend': S.pretend = el.dataset.v; if(S.pretend === 'during'){ S.screen = 'itinerary'; S.day = tripDayIndex(); S.mapMode = 'day'; } else { S.screen = 'home'; S.day = 0; } S.mapFocus = S.mapPopup = null; window.scrollTo(0, 0); toast(S.pretend === 'during' ? 'During a trip, the app opens on today in the Itinerary' : 'Before a trip, the app opens on your world map'); break;
    case 'gotoday': S.screen = 'itinerary'; S.day = tripDayIndex(); S.mapMode = 'day'; window.scrollTo(0, 0); break;
    case 'mapm': S.mapMode = el.dataset.m; S.mapFocus = null; S.mapPopup = null; break;
    case 'closepop': S.mapPopup = null; S.mapFocus = null; break;
    case 'nav': S.screen = el.dataset.to; S.dialog = null; S.picking = null; window.scrollTo(0, 0); break;
    case 'sync': S.sync = { synced:'saving', saving:'offline', offline:'expiring', expiring:'stopped', stopped:'synced' }[S.sync]; break;
    case 'syncnow': S.sync = 'synced'; toast('Synced with GitHub'); break;
    case 'savetoken': S.sync = 'synced'; S.dialog = null; toast('Token saved on this device · synced'); break;
    case 'helper': S.helperSet = !S.helperSet; break;
    case 'showkey': S.showKey = !S.showKey; break;
    case 'sz': S.scale = Math.max(.8, Math.min(1.5, +(S.scale + .1 * el.dataset.d).toFixed(1))); break;
    case 'toast': toast(el.dataset.m); return;
    case 'dialog': S.dialog = el.dataset.d; break;
    case 'close': case 'closebg': S.dialog = null; break;
    case 'confirmyes': { const fn = S.confirm.fn; S.dialog = null; fn(); } break;
    case 'hl': S.hlCity = S.hlCity === el.dataset.c ? null : el.dataset.c; break;
    case 'opentrip': if(el.dataset.id === 'jp'){ S.screen = 'overview'; window.scrollTo(0, 0); } else { toast('Opens that trip. Only Japan is filled in for the mockup.'); return; } break;
    case 'savepast': {
      const f = S.pastForm; const cs = f.cities.split(',').map(s => s.trim()).filter(Boolean).map(c => Object.keys(CITY_DB).find(k => k.toLowerCase() === c.toLowerCase())).filter(Boolean);
      if(!f.name || !f.from || !cs.length){ toast('Add a name, a start date and at least one city.'); return; }
      TRIPS.push({ id:uid(), name:f.name, start:f.from, end:f.to || f.from, route:'SIN', cities:cs, kind:'maponly' }); TRIPS.sort((x, y) => y.start.localeCompare(x.start));
      S.pastForm = { name:'', from:'', to:'', cities:'' }; S.dialog = null; S.screen = 'home'; toast(`Added ${f.name} · ${cs.join(', ')} now on your map`); window.scrollTo(0, 0);
    } break;
    case 'askdeltrip': { if(el.dataset.id === 'jp'){ toast('The mockup keeps the Japan trip so the other screens still work.'); return; } const t = TRIPS.find(x => x.id === el.dataset.id); confirmBox('Delete this trip?', `<b>${esc(t.name)}</b> will be removed from every device. Its older versions stay in your GitHub history.`, 'Delete trip', () => { TRIPS.splice(TRIPS.indexOf(t), 1); toast('Trip deleted'); render(); }); } return;
    case 'askclear': confirmBox('Clear this trip?', 'All days, places and expenses in Japan in Autumn will be removed.', 'Clear trip', () => toast('Mockup: nothing was cleared')); return;
    case 'note': S.openNotes = S.openNotes || new Set(); S.openNotes.has(el.dataset.id) ? S.openNotes.delete(el.dataset.id) : S.openNotes.add(el.dataset.id); break;
    case 'mapday': S.screen = 'itinerary'; window.scrollTo(0, 0); S.day = +el.dataset.i; S.mapMode = 'day'; S.mapFocus = null; S.mapPopup = null; break;
    case 'pin': S.mapPopup = el.dataset.id; break;
    case 'unfocus': S.mapFocus = null; break;
    case 'pick': { S.picking = el.dataset.id; const f = findPlace(el.dataset.id); S.screen = 'itinerary'; S.day = TRIP.days.indexOf(f.d); S.mapMode = 'day'; S.mapFocus = null; S.mapPopup = null; window.scrollTo(0, 0); } break;
    case 'pickcancel': S.picking = null; break;
    case 'mapclick': {
      if(!S.picking) return; const svg = el.closest('svg'); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse()); const ll = unJ(loc.x, loc.y); const f2 = findPlace(S.picking);
      f2.p.lat = +ll.lat.toFixed(5); f2.p.lon = +ll.lon.toFixed(5); S.picking = null; S.mapPopup = f2.p.id; toast(`Pinned ${f2.p.name}`);
    } break;
    case 'day': if(S.screen !== 'itinerary'){ S.screen = 'itinerary'; window.scrollTo(0, 0); } S.day = +el.dataset.i; S.addDay = null; S.hFrom = S.hTo = null; S.mapFocus = null; S.mapPopup = null; S.picking = null; break;
    case 'addday': { const last = TRIP.days[TRIP.days.length - 1]; TRIP.days.push(D(addDaysISO(last.date, 1), '', '', [], [])); S.day = TRIP.days.length - 1; toast(`Added Day ${TRIP.days.length} · ${dLong(TRIP.days[S.day].date)} (the day after the last one)`); } break;
    case 'askdelday': { const i = S.day; confirmBox(`Delete Day ${i + 1}?`, `Its places, hotel, flights, timings and notes will be removed.`, 'Delete day', () => { TRIP.days.splice(i, 1); S.day = Math.max(0, i - 1); toast(`Deleted Day ${i + 1}`); render(); }); } return;
    case 'delplace': { const f = findPlace(el.dataset.id); f.d.places.splice(f.i, 1); toast(`Removed ${f.p.name}`); } break;
    case 'moveday': {
      const i = +el.dataset.i, j = i + +el.dataset.d; if(j < 0 || j >= TRIP.days.length) return;
      const dates = TRIP.days.map(d => d.date);            // dates stay in order; the plans swap
      [TRIP.days[i], TRIP.days[j]] = [TRIP.days[j], TRIP.days[i]];
      TRIP.days.forEach((d, k) => d.date = dates[k]);
      if(S.screen === 'itinerary') S.day = j;
      toast(`Moved ${TRIP.days[j].city || 'the day'} to Day ${j + 1} · dates stay in order`);
    } break;
    case 'addtime': TRIP.days[S.day].times.push({ t:'', d:'' }); break;
    case 'deltime': TRIP.days[S.day].times.splice(+el.dataset.k, 1); break;
    case 'atype': S.addType = el.dataset.t; S.wiki = null; break;
    case 'acat': S.addCat = el.dataset.c; break;
    case 'amode': S.addMode = el.dataset.m; break;
    case 'ex': S.link = EX[el.dataset.k]; break;
    case 'pickres': S.picked = el.dataset.n; S.q = el.dataset.n; break;
    case 'wiki': { const name = S.addMode === 'search' ? (S.picked || S.q) : parseMaps(S.link).name; const hit = Object.keys(WIKI).find(k => (name || '').toLowerCase().includes(k.toLowerCase())); S.wiki = hit ? WIKI[hit] : `No Wikipedia summary found${name ? ' for "' + name + '"' : ''}. Try "Senso-ji" or "Meiji Jingu" in the mockup.`; if(hit) S.addNote = S.addNote || WIKI[hit]; } break;
    case 'addplace': addPlace(); return;
    case 'cat': S.draft.cat = el.dataset.c; break;
    case 'saveexp': saveExpense(); return;
    case 'editexp': { const x = EXPENSES.find(y => y.id === el.dataset.id); S.editing = x.id; S.draft = { cat:x.cat, desc:x.desc, date:x.date, cur:x.cur, total:x.total ?? '', nights:x.nights ?? '', unit:x.unit ?? '', qty:x.qty ?? '1' }; document.querySelector('[data-form="exp"]')?.scrollIntoView({ behavior:'smooth', block:'start' }); } break;
    case 'canceledit': S.editing = null; S.draft = { ...S.draft, desc:'', total:'', nights:'', unit:'' }; break;
    case 'delexp': { const i = EXPENSES.findIndex(y => y.id === el.dataset.id); const x = EXPENSES[i]; EXPENSES.splice(i, 1); if(S.editing === x.id) S.editing = null; toast(`Deleted ${x.desc}`); } break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const t = e.target; const d = TRIP.days[S.day];
  if(t.dataset.f){ S.draft[t.dataset.f] = t.value; const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  if(t.dataset.pf){ S.pastForm[t.dataset.pf] = t.value; if(t.dataset.pf === 'cities'){ const pc = document.getElementById('pcheck'); pc.innerHTML = pastCheckHTML(t.value.split(',').map(s => s.trim()).filter(Boolean)); } return; }
  switch(t.dataset.in){
    case 'tripname': TRIP.name = t.value; break;
    case 'dcity': d.city = t.value; break;
    case 'dnotes': d.notes = t.value; break;
    case 'ttime': d.times[+t.dataset.k].t = t.value; break;
    case 'tdesc': d.times[+t.dataset.k].d = t.value; break;
    case 'pnote': findPlace(t.dataset.id).p.note = t.value; break;
    case 'aq': S.q = t.value; S.picked = null; document.getElementById('ares').innerHTML = searchResHTML(); break;
    case 'alink': S.link = t.value; document.getElementById('alinkres').innerHTML = linkResHTML(); break;
    case 'fname': S.fName = t.value; break;
    case 'anote': S.addNote = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.f === 'cur'){ S.draft.cur = t.value; const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  switch(t.dataset.in){
    case 'ddate': TRIP.days[S.day].date = t.value; render(); break;
    case 'fdep': S.fDep = t.value; break;
    case 'farr': S.fArr = t.value; break;
    case 'aday': S.addDay = +t.value; break;
    case 'hfrom': S.hFrom = +t.value; break;
    case 'hto': S.hTo = +t.value; break;
    case 'lcur': TRIP.localCur = t.value; S.draft.cur = t.value; render(); break;
    case 'bcur': TRIP.base = t.value; render(); break;
    case 'findplace': S.mapFocus = t.value || null; S.mapPopup = t.value || null; render(); break;
    case 'moveto': { const f = findPlace(t.dataset.id); const to = +t.value; f.d.places.splice(f.i, 1); TRIP.days[to].places.push(f.p); toast(`Moved ${f.p.name} to Day ${to + 1}`); render(); } break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && (S.dialog || S.picking)){ S.dialog = null; S.picking = null; render(); } });

/* ================= drag and drop (touch + mouse) ================= */
let drag = null;
function movePlace(fromDay, fromIdx, toDay, toIdx){
  const src = TRIP.days[fromDay].places; const [p] = src.splice(fromIdx, 1); const dst = TRIP.days[toDay].places;
  let at = toIdx == null ? dst.length : toIdx; if(fromDay === toDay && fromIdx < at) at -= 1;
  dst.splice(Math.max(0, Math.min(at, dst.length)), 0, p);
  toast(fromDay === toDay ? `Moved ${p.name}` : `Moved ${p.name} to Day ${toDay + 1}`);
  render();
}
function clearMarks(){ document.querySelectorAll('.drop-target,.drop-before,.drop-after').forEach(n => n.classList.remove('drop-target', 'drop-before', 'drop-after')); }
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if(!h) return;
  const kind = h.dataset.drag; const srcEl = kind === 'ov' ? h : h.closest('.item');
  drag = { kind, day:+h.dataset.day, idx:+h.dataset.idx, x:e.clientX, y:e.clientY, started:false, srcEl, ghost:null, target:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.started){ if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.started = true;
    const r = drag.srcEl.getBoundingClientRect(); const g = drag.srcEl.cloneNode(true); g.classList.add('dragghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; drag.srcEl.classList.add('dragging-src'); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  // auto-scroll near the top/bottom edge so you can reach Day 3 from Day 1
  const edge = 70; if(e.clientY < edge) window.scrollBy(0, -14); else if(e.clientY > innerHeight - edge) window.scrollBy(0, 14);
  clearMarks(); drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = ''; drag.target = null;
  if(!under) return;
  if(drag.kind === 'ov'){
    const chip = under.closest('.pchip'); const card = under.closest('.ov-card');
    if(chip && chip !== drag.srcEl){ const r = chip.getBoundingClientRect(); const before = e.clientX < r.left + r.width / 2; chip.classList.add(before ? 'drop-before' : 'drop-after'); drag.target = { day:+chip.dataset.day, idx:+chip.dataset.idx + (before ? 0 : 1) }; }
    else if(card){ card.classList.add('drop-target'); drag.target = { day:+card.dataset.day, idx:null }; }
  } else {
    const item = under.closest('.item[data-drag-item]');
    if(item && item !== drag.srcEl){ const [dd, ii] = item.dataset.dragItem.split(':').map(Number); const r = item.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
      if(TRIP.days[dd].places[ii].type === 'activity'){ item.classList.add(before ? 'drop-before' : 'drop-after'); drag.target = { day:dd, idx:ii + (before ? 0 : 1) }; } }
  }
}, { passive:false });
document.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.started) return;
  d.ghost.remove(); clearMarks(); d.srcEl.classList.remove('dragging-src');
  if(d.target && !(d.target.day === d.day && (d.target.idx === d.idx || d.target.idx === d.idx + 1))) movePlace(d.day, d.idx, d.target.day, d.target.idx);
});
document.addEventListener('pointercancel', () => { if(drag){ drag.ghost?.remove(); clearMarks(); drag.srcEl.classList.remove('dragging-src'); drag = null; } });

render();
</script>

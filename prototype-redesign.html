<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Trip Tracker Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — throwaway. Not the real app; nothing here saves anywhere.
  Question: "What should the redesigned Trip Tracker look like?"
  Three structurally different layouts of the same app, switchable from the floating bar
  (or the ← / → keys, or #variant-a / #variant-b / #variant-c in the address).
  Every layout carries the same new ideas: world-map home page, bigger and calmer type,
  hotel nights + per-night price, price-per-person × people, add a place from a Google Maps
  link, and a sync status. The data is sample data for a made-up trip.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: one app, three shells — A keeps today's top-tabs layout but larger,
   B is a map-first iPad layout with a sidebar, C is a one-column journal with a bottom tab bar.
   Palette stays the user's "Boarding Pass" theme; contrast on secondary text is raised. */
:root{
  color-scheme: light;
  --navy:#101b2d; --navy-2:#1a2a42; --navy-3:#24385a;
  --paper:#f5eedd; --paper-2:#ebe1c9; --card:#fffaf0;
  --brass:#c99a3d; --brass-ink:#8a6420; --teal:#2f6e66; --brick:#a34a2f;
  --ink:#1b2029; --muted:#4f4a3d; --faint:#7b745f;
  --line:rgba(16,27,45,.16); --line-strong:rgba(16,27,45,.3);
  --on-navy:#f1e9d4; --on-navy-muted:#b3bdcd;
  --good:#2f6e66; --warn:#a8641c;
  --display:'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --body:'Inter', system-ui, sans-serif;
  --scale:1;
}
html{ font-size:calc(100% * var(--scale)); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:1.0625rem; line-height:1.55; -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; }
h1,h2,h3{ font-family:var(--display); text-wrap:balance; margin:0; line-height:1.2; }
p{ margin:0; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:.8125rem; letter-spacing:.08em; text-transform:uppercase; color:var(--brass-ink); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- shared controls ---------- */
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field label, .field .lbl{ font-size:.9375rem; font-weight:600; color:var(--muted); }
.inp{ width:100%; min-height:48px; padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:10px; background:#fff; font-size:1.0625rem; }
.inp:focus{ border-color:var(--teal); outline:none; box-shadow:0 0 0 3px rgba(47,110,102,.18); }
textarea.inp{ min-height:96px; resize:vertical; line-height:1.45; }
.inp.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:999px; border:1.5px solid var(--navy); background:var(--navy); color:var(--on-navy); font-weight:600; font-size:1rem; }
.btn.ghost{ background:transparent; color:var(--navy); }
.btn.brass{ background:var(--brass); border-color:var(--brass); color:var(--navy); }
.btn.small{ min-height:40px; padding:6px 14px; font-size:.9375rem; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:44px; padding:8px 16px; border-radius:999px; border:1.5px solid var(--line-strong); background:#fff; font-size:.9688rem; font-weight:500; }
.chip[aria-pressed="true"]{ background:var(--navy); border-color:var(--navy); color:var(--on-navy); }
.seg{ display:inline-flex; padding:4px; border-radius:999px; background:var(--paper-2); gap:4px; }
.seg button{ min-height:40px; padding:6px 16px; border-radius:999px; border:0; background:transparent; font-weight:600; font-size:.9375rem; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(16,27,45,.15); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } }

/* calculation result line — the "show me per night / per person" idea */
.calc{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding:14px 16px; border-radius:12px; background:var(--paper-2); border:1.5px dashed var(--line-strong); }
.calc .big{ font-family:var(--mono); font-size:1.375rem; font-weight:600; color:var(--navy); }
.calc .sub{ font-size:.9688rem; color:var(--muted); }
.calc.empty .big{ color:var(--faint); font-weight:500; font-size:1.0625rem; font-family:var(--body); }

/* sync chip */
.sync{ display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:6px 14px 6px 12px; border-radius:999px; border:1.5px solid currentColor; background:transparent; font-size:.9375rem; font-weight:500; text-align:left; }
.sync .dot{ width:10px; height:10px; border-radius:50%; background:var(--good); flex:0 0 auto; }
.sync[data-s="syncing"] .dot{ background:var(--brass); animation:pulse 1s infinite; }
.sync[data-s="offline"] .dot{ background:var(--warn); }
@keyframes pulse{ 50%{ opacity:.3; } }

/* world map */
.world{ position:relative; width:100%; }
.world svg{ display:block; width:100%; height:auto; }
.world .lab{ position:absolute; transform:translate(8px,-50%); white-space:nowrap; font-size:.8125rem; font-weight:600; pointer-events:none; line-height:1.1; }
.world .lab.l{ transform:translate(calc(-100% - 8px),-50%); }
.world .lab.b{ transform:translate(-50%, 9px); }
.world .lab.t{ transform:translate(-50%, calc(-100% - 9px)); }
.world .lab.hl{ font-size:.9375rem; }
@media (max-width:700px){ .world .lab:not(.hl){ display:none; } }
.citydot{ cursor:pointer; }

/* trip map */
.tripmap{ position:relative; width:100%; overflow:hidden; border-radius:14px; }
.tripmap svg{ display:block; width:100%; height:100%; }
.mapnote{ position:absolute; left:10px; bottom:10px; font-size:.8125rem; color:var(--muted); background:rgba(255,250,240,.88); padding:4px 10px; border-radius:8px; pointer-events:none; }
.newpin{ animation:ring 1.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes ring{ 0%{ opacity:.9; transform:scale(.6);} 100%{ opacity:0; transform:scale(2.2);} }
@media (prefers-reduced-motion:reduce){ .newpin, .sync .dot{ animation:none !important; } }

/* add-place form */
.linkres{ display:flex; flex-direction:column; gap:12px; padding:16px; border-radius:12px; border:1.5px solid var(--line); background:#fff; }
.linkres.ok{ border-color:var(--teal); }
.linkres.warn{ border-color:var(--warn); background:#fff7ec; }
.linkres h4{ margin:0; font-family:var(--display); font-size:1.125rem; }
.linkres .meta{ color:var(--muted); font-size:.9688rem; }
.examples{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.examples span{ font-size:.9375rem; color:var(--muted); }
.results{ display:flex; flex-direction:column; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
.results button{ text-align:left; padding:12px 16px; border:0; border-bottom:1px solid var(--line); background:#fff; display:flex; flex-direction:column; gap:2px; min-height:56px; }
.results button:last-child{ border-bottom:0; }
.results b{ font-weight:600; }
.results small{ color:var(--muted); font-size:.9375rem; }

.toast{ position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:60; background:var(--navy); color:var(--on-navy); padding:12px 20px; border-radius:12px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:calc(100% - 32px); }

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:80; display:flex; align-items:center; gap:4px; padding:6px; border-radius:999px; background:#0b0b0d; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.35); font-family:var(--mono); font-size:13px; max-width:calc(100% - 24px); }
.proto-bar button{ min-width:40px; min-height:40px; border-radius:999px; border:0; background:#26262b; color:#fff; font-size:16px; }
.proto-bar .lbl{ padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proto-bar .sep{ width:1px; height:24px; background:#3a3a40; margin:0 4px; }
.proto-bar .sz{ font-size:12px; color:#bbb; min-width:40px; text-align:center; }
body.c-active .proto-bar{ bottom:calc(92px + env(safe-area-inset-bottom,0px)); }
@media (max-width:520px){ .proto-bar .lbl small{ display:none; } }

/* =========================================================
   VARIANT A — "Boarding pass, larger": today's layout, top tabs
   ========================================================= */
.vA{ --body:'Inter', system-ui, sans-serif; font-family:var(--body); background:var(--paper); min-height:100vh; padding-bottom:110px; }
.a-top{ background:var(--navy); color:var(--on-navy); }
.a-top-in, .a-tabs-in, .a-main{ max-width:1400px; margin:0 auto; padding-left:max(24px, env(safe-area-inset-left,0px)); padding-right:max(24px, env(safe-area-inset-right,0px)); }
.a-top-in{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding-block:18px 14px; }
.a-brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.25rem; }
.a-brand svg{ width:30px; height:30px; color:var(--brass); }
.a-trip{ flex:1 1 260px; min-width:0; text-align:left; background:var(--navy-2); border:1px solid var(--navy-3); color:var(--on-navy); border-radius:12px; padding:10px 16px; display:flex; flex-direction:column; }
.a-trip b{ font-family:var(--display); font-size:1.125rem; }
.a-trip small{ color:var(--on-navy-muted); font-size:.9375rem; }
.a-top .sync{ color:var(--on-navy); border-color:var(--navy-3); }
.a-tabs-in{ display:flex; gap:6px; overflow-x:auto; }
.a-tab{ min-height:52px; padding:10px 20px; border:0; background:transparent; color:var(--on-navy-muted); font-weight:600; font-size:1.0625rem; border-bottom:3px solid transparent; white-space:nowrap; }
.a-tab[aria-current="page"]{ color:var(--on-navy); border-bottom-color:var(--brass); }
.a-main{ padding-block:28px; display:flex; flex-direction:column; gap:28px; }
.a-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; }
@media (max-width:600px){ .a-card{ padding:18px; border-radius:14px; } .a-top-in,.a-tabs-in,.a-main{ padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); } }

.a-hero{ background:var(--navy); color:var(--on-navy); border-radius:22px; padding:28px; display:flex; flex-direction:column; gap:20px; }
.a-hero h1{ font-size:clamp(1.75rem, 3.4vw, 2.5rem); font-weight:700; }
.a-hero .eyebrow{ color:var(--brass); }
.a-hero-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.legend{ display:flex; gap:18px; flex-wrap:wrap; font-size:.9375rem; }
.legend span{ display:inline-flex; align-items:center; gap:8px; }
.legend i{ width:12px; height:12px; border-radius:50%; display:inline-block; }
.a-hero .world .lab{ color:var(--on-navy); text-shadow:0 1px 2px var(--navy), 0 0 6px var(--navy); }
.a-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:0; border-top:1px solid var(--navy-3); padding-top:18px; }
.a-stats div{ padding:0 18px; border-left:1px solid var(--navy-3); }
.a-stats div:first-child{ border-left:0; padding-left:0; }
.a-stats dt{ font-size:.875rem; color:var(--on-navy-muted); }
.a-stats dd{ margin:2px 0 0; font-family:var(--mono); font-size:1.625rem; font-weight:600; color:var(--on-navy); }
@media (max-width:640px){ .a-stats{ grid-template-columns:1fr 1fr; row-gap:14px; } .a-stats div:nth-child(3){ border-left:0; padding-left:0; } .a-hero{ padding:20px; } }

.a-sec-h{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.a-sec-h h2{ font-size:1.5rem; }
.a-passes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap:18px; margin-top:16px; }
.pass{ display:grid; grid-template-columns:1fr auto; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:0; overflow:hidden; color:var(--ink); }
.pass .main{ padding:18px 20px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.pass .main b{ font-family:var(--display); font-size:1.1875rem; }
.pass .main .cities{ color:var(--muted); font-size:.9688rem; }
.pass .stub{ padding:18px 20px; border-left:2px dashed var(--line-strong); display:flex; flex-direction:column; justify-content:space-between; gap:6px; background:var(--paper); min-width:150px; }
.pass .stub .route{ font-family:var(--mono); font-weight:600; font-size:1rem; }
.pass .stub small{ font-family:var(--mono); color:var(--muted); font-size:.875rem; }
.pass.up{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(201,154,61,.3); }
.pass.up .stub{ background:var(--navy); color:var(--on-navy); border-left-color:var(--brass); }
.pass.up .stub small{ color:var(--on-navy-muted); }
.tag{ display:inline-flex; align-self:flex-start; padding:3px 10px; border-radius:999px; font-family:var(--mono); font-size:.8125rem; letter-spacing:.05em; text-transform:uppercase; background:var(--paper-2); color:var(--muted); }
.tag.up{ background:var(--brass); color:var(--navy); }

.a-daystrip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
.a-day{ flex:0 0 auto; min-width:128px; text-align:left; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); display:flex; flex-direction:column; gap:2px; }
.a-day small{ font-family:var(--mono); font-size:.8125rem; color:var(--muted); }
.a-day b{ font-size:1rem; }
.a-day[aria-current="true"]{ border-color:var(--navy); background:var(--navy); color:var(--on-navy); }
.a-day[aria-current="true"] small{ color:var(--brass); }
.a-daygrid{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px; align-items:start; }
.a-mapcol{ position:sticky; top:16px; display:flex; flex-direction:column; gap:12px; }
.a-mapcol .tripmap{ aspect-ratio:4/3.4; border:1px solid var(--line); }
@media (max-width:900px){ .a-daygrid{ grid-template-columns:1fr; } .a-mapcol{ position:static; order:-1; } .a-mapcol .tripmap{ aspect-ratio:16/10; } }
.a-plan{ display:flex; flex-direction:column; gap:22px; }
.a-plan-h{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
.a-plan-h h1{ font-size:2rem; }
.notes{ padding:14px 16px; border-left:4px solid var(--brass); background:var(--paper); border-radius:0 10px 10px 0; font-size:1.0625rem; }
.a-plan h3{ font-size:.875rem; font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; font-weight:500; }
.times{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.times li{ display:grid; grid-template-columns:70px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); }
.times li:last-child{ border-bottom:0; }
.times .t{ font-family:var(--mono); font-weight:600; color:var(--teal); }
.stops{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.stop{ display:grid; grid-template-columns:40px 1fr; gap:14px; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
.stop .n{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-family:var(--mono); font-weight:600; font-size:.9375rem; }
.stop .n.sq{ border-radius:9px; }
.stop b{ font-size:1.0625rem; font-weight:600; }
.stop .addr{ color:var(--muted); font-size:.9375rem; }
.stop .note{ margin-top:6px; font-size:.9688rem; }
.stop .kind{ font-size:.875rem; color:var(--muted); margin-left:6px; font-weight:500; }

.a-budget{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; }
.a-budget .span2{ grid-column:1 / -1; }
@media (max-width:900px){ .a-budget{ grid-template-columns:1fr; } }
.total{ font-family:var(--mono); font-size:clamp(2rem,4vw,2.75rem); font-weight:600; color:var(--navy); line-height:1.1; }
.bars{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
.bar{ display:grid; grid-template-columns:130px 1fr auto; gap:12px; align-items:center; font-size:.9688rem; }
.bar .track{ height:12px; background:var(--paper-2); border-radius:6px; overflow:hidden; }
.bar .fill{ height:100%; border-radius:6px; }
.bar .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; min-width:90px; text-align:right; }
@media (max-width:480px){ .bar{ grid-template-columns:96px 1fr; } .bar .v{ grid-column:2; text-align:left; } }
.form{ display:flex; flex-direction:column; gap:16px; }
.tablewrap{ overflow-x:auto; }
table.ledger{ width:100%; border-collapse:collapse; font-size:1rem; min-width:640px; }
.ledger th{ text-align:left; font-family:var(--mono); font-size:.8125rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:10px 12px; border-bottom:2px solid var(--line-strong); }
.ledger td{ padding:14px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
.ledger td.num, .ledger th.num{ text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
.ledger .brk{ color:var(--teal); font-family:var(--mono); font-size:.9375rem; white-space:nowrap; }
.ledger .catdot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }

.overlay{ position:fixed; inset:0; z-index:50; background:rgba(16,27,45,.55); display:flex; align-items:center; justify-content:center; padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px)); }
.dialog{ width:min(680px, 100%); max-height:calc(100vh - 48px); overflow:auto; background:var(--card); border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:18px; }
.dialog-h{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.dialog-h h2{ font-size:1.5rem; }
.x{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line-strong); background:transparent; font-size:1.25rem; }

/* =========================================================
   VARIANT B — "Atlas": map-first, sidebar + panel + big map
   ========================================================= */
.vB{ --body:'Atkinson Hyperlegible', system-ui, sans-serif; font-family:var(--body); font-size:1.125rem; height:100vh; display:grid; grid-template-columns:260px 420px minmax(0,1fr); background:var(--paper); }
.b-side{ background:var(--navy); color:var(--on-navy); display:flex; flex-direction:column; gap:18px; padding:22px 14px calc(22px + env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px)); overflow:auto; }
.b-brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.1875rem; padding:0 8px; }
.b-brand svg{ width:28px; height:28px; color:var(--brass); }
.b-nav{ display:flex; flex-direction:column; gap:2px; }
.b-nav .h{ font-family:var(--mono); font-size:.8125rem; letter-spacing:.08em; text-transform:uppercase; color:var(--brass); padding:14px 10px 6px; }
.b-link{ display:flex; align-items:center; gap:12px; min-height:48px; padding:8px 10px; border-radius:10px; border:0; background:transparent; color:var(--on-navy); text-align:left; font-size:1.0625rem; }
.b-link small{ margin-left:auto; font-family:var(--mono); font-size:.8125rem; color:var(--on-navy-muted); }
.b-link[aria-current="true"]{ background:var(--navy-3); }
.b-link .d{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
.b-link .ic{ width:22px; text-align:center; }
.b-side .sync{ color:var(--on-navy); border-color:var(--navy-3); margin-top:auto; width:100%; }
.b-panel{ background:var(--card); border-right:1px solid var(--line); overflow:auto; padding:26px 24px 120px; display:flex; flex-direction:column; gap:20px; }
.b-panel h1{ font-size:1.75rem; }
.b-main{ position:relative; overflow:auto; min-width:0; }
.b-main .tripmap{ position:absolute; inset:0; height:100%; border-radius:0; }

function stats(){

/* ===== World map (equirectangular, 1 unit = 1°) ===== */
const W = (lon, lat) => [lon + 180, 90 - lat];
function worldMap(opts){
  const { look, fit, labels = true, arcs = false } = opts;
  let vb = [0, 8, 360, 132];
  if(fit){
    const pts = Object.values(CITIES).map(c => W(c[1], c[0])).concat([W(HOME.lon, HOME.lat)]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    let x0 = Math.min(...xs) - 16, x1 = Math.max(...xs) + 32, y0 = Math.min(...ys) - 10, y1 = Math.max(...ys) + 10;
    const want = 1.45; const h = y1 - y0, w = x1 - x0;
    if(w / h < want){ const nw = h * want; x0 -= (nw - w) / 2; x1 += (nw - w) / 2; } else { const nh = w / want; y0 -= (nh - h) / 2; y1 += (nh - h) / 2; }
    vb = [x0, y0, x1 - x0, y1 - y0];
  }
  const C = {
    a:{ sea:'transparent', land:'#24385a', stroke:'#2f4670', past:'#c99a3d', up:'#f1e9d4', home:'#5fb3a6', arc:'rgba(201,154,61,.55)' },
    b:{ sea:'#dfe7e6', land:'#f8f3e6', stroke:'#c9bfa5', past:'#a34a2f', up:'#2f6e66', home:'#101b2d', arc:'rgba(163,74,47,.45)' },
    c:{ sea:'transparent', land:'#e2d7bb', stroke:'#e2d7bb', past:'#101b2d', up:'#c99a3d', home:'#2f6e66', arc:'rgba(16,27,45,.35)' },
  }[look];
  const r = vb[2] * (look === 'c' ? 0.011 : look === 'b' ? 0.009 : 0.0062);   // dot size follows the zoom
  let s = `<svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map of cities visited">`;
  if(C.sea !== 'transparent') s += `<rect x="${vb[0]-400}" y="${vb[1]-400}" width="${vb[2]+800}" height="${vb[3]+800}" fill="${C.sea}"/>`;
  s += `<path d="${LAND}" fill="${C.land}" stroke="${C.stroke}" stroke-width="0.6" vector-effect="non-scaling-stroke"/>`;
  const H = W(HOME.lon, HOME.lat);
  if(arcs){
    TRIPS.forEach(t => {
      const c = CITIES[t.cities[0]]; const P = W(c[1], c[0]);
      const mx = (H[0] + P[0]) / 2, my = (H[1] + P[1]) / 2; const dx = P[0] - H[0], dy = P[1] - H[1]; const len = Math.hypot(dx, dy);
      let px = -dy / len, py = dx / len; if(py > 0){ px = -px; py = -py; }
      const cx = mx + px * len * 0.2, cy = my + py * len * 0.2;
      s += `<path d="M${H[0]} ${H[1]} Q${cx.toFixed(2)} ${cy.toFixed(2)} ${P[0]} ${P[1]}" fill="none" stroke="${C.arc}" stroke-width="1.4" stroke-dasharray="${t.upcoming ? '4 4' : '0'}" vector-effect="non-scaling-stroke"/>`;
    });
  }
  Object.entries(CITIES).forEach(([name, c]) => {
    const [x, y] = W(c[1], c[0]); const st = cityStatus(name); const hl = S.hlCity === name;
    const rr = hl ? r * 1.8 : r;
    s += st === 'past'
      ? `<circle class="citydot" data-act="hl" data-c="${esc(name)}" cx="${x}" cy="${y}" r="${rr}" fill="${C.past}" stroke="${look === 'a' ? '#101b2d' : '#fff'}" stroke-width="1.2" vector-effect="non-scaling-stroke"><title>${esc(name)}</title></circle>`
      : `<circle class="citydot" data-act="hl" data-c="${esc(name)}" cx="${x}" cy="${y}" r="${rr}" fill="none" stroke="${C.up}" stroke-width="2" vector-effect="non-scaling-stroke"><title>${esc(name)} (upcoming)</title></circle>`;
  });
  s += `<rect x="${H[0] - r}" y="${H[1] - r}" width="${r * 2}" height="${r * 2}" fill="${C.home}" transform="rotate(45 ${H[0]} ${H[1]})"><title>Singapore (home)</title></rect>`;
  s += `</svg>`;
  let labs = '';
  if(labels){
    const pos = (lon, lat) => { const [x, y] = W(lon, lat); return `left:${((x - vb[0]) / vb[2] * 100).toFixed(2)}%;top:${((y - vb[1]) / vb[3] * 100).toFixed(2)}%`; };
    Object.entries(CITIES).forEach(([name, c]) => {
      const hl = S.hlCity === name;
      if(!c[3] && !hl) return;
      const cls = hl ? 'r hl' : c[3];
      labs += `<span class="lab ${cls === 'r' ? '' : cls}" style="${pos(c[1], c[0])}">${esc(hl ? name : (LABEL_TEXT[name] || name))}</span>`;
    });
    labs += `<span class="lab b" style="${pos(HOME.lon, HOME.lat)}">Singapore · home</span>`;
  }
  return `<div class="world">${s}${labs}</div>`;
}

/* ===== Trip map (Japan, cos-corrected equirectangular) ===== */
const KX = Math.cos(36 * Math.PI / 180);
const J = (lon, lat) => [(lon + 180) * KX, 90 - lat];
function tripMap(opts){
  const { aspect = 4/3, look = 'a', extra = null } = opts;
  const mode = S.mapMode;
  const d = DAYS[S.day];
  let marks = [];      // {x,y,label,color,kind,txt}
  let route = [];
  if(mode === 'day'){
    let n = 0;
    d.places.forEach(p => {
      const [x, y] = J(p.lon, p.lat);
      const kind = p.t === 'hotel' ? 'hotel' : p.t === 'flight' ? 'flight' : 'stop';
      const txt = kind === 'hotel' ? 'H' : kind === 'flight' ? '✈' : String(++n);
      marks.push({ x, y, kind, txt, color: DAY_COLORS[S.day % 8], name: p.name });
      if(kind === 'stop') route.push([x, y]);
    });
  } else {
    const byCity = {};
    DAYS.forEach((dd, i) => dd.places.forEach(p => {
      if(p.t === 'flight') return;
      const key = dd.city.split(' ')[0];
      (byCity[key] = byCity[key] || { pts:[], days:new Set(), i }).pts.push(J(p.lon, p.lat)); byCity[key].days.add(i + 1);
    }));
    Object.entries(byCity).forEach(([city, o]) => {
      const x = o.pts.reduce((a, p) => a + p[0], 0) / o.pts.length, y = o.pts.reduce((a, p) => a + p[1], 0) / o.pts.length;
      const ds = [...o.days]; const rng = ds.length > 1 ? `Days ${ds[0]}–${ds[ds.length - 1]}` : `Day ${ds[0]}`;
      marks.push({ x, y, kind:'city', txt:String(ds[0]), color: DAY_COLORS[o.i % 8], name: `${city} · ${rng}` });
      route.push([x, y]);
    });
  }
  const pts = marks.map(m => [m.x, m.y]);
  if(extra) pts.push(J(extra.lon, extra.lat));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const minSpan = mode === 'day' ? 0.06 : 2.5;
  let w = Math.max(x1 - x0, minSpan), h = Math.max(y1 - y0, minSpan / aspect);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  w *= 1.45; h *= 1.45;
  if(w / h < aspect) w = h * aspect; else h = w / aspect;
  const vb = [cx - w / 2, cy - h / 2, w, h];
  const R = w * 0.028;
  const C = {
    a:{ sea:'#dce5e3', land:'#f6f0e1', stroke:'#c4b998', route:'#101b2d' },
    b:{ sea:'#dfe7e6', land:'#f8f3e6', stroke:'#c9bfa5', route:'#101b2d' },
    c:{ sea:'#e6ece9', land:'#f7f1e2', stroke:'#cdbf9c', route:'#101b2d' },
  }[look];
  let s = `<svg viewBox="${vb.map(v => v.toFixed(4)).join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Trip map">`;
  s += `<rect x="${vb[0] - w}" y="${vb[1] - h}" width="${w * 3}" height="${h * 3}" fill="${C.sea}"/>`;
  s += `<g transform="scale(${KX} 1)"><path d="${JAPAN}" fill="${C.land}" stroke="${C.stroke}" stroke-width="1" vector-effect="non-scaling-stroke"/></g>`;
  if(route.length > 1) s += `<polyline points="${route.map(p => p.join(',')).join(' ')}" fill="none" stroke="${C.route}" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`;
  marks.forEach(m => {
    s += '<g>';
    if(m.kind === 'hotel') s += `<rect x="${m.x - R}" y="${m.y - R}" width="${R * 2}" height="${R * 2}" rx="${R * .35}" fill="#101b2d" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    else s += `<circle cx="${m.x}" cy="${m.y}" r="${R}" fill="${m.kind === 'flight' ? '#5c7a9c' : m.color}" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    s += `<text x="${m.x}" y="${m.y}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="${R * 1.05}" fill="#fff">${m.txt}</text>`;
    if(m.kind === 'city') s += `<text x="${m.x + R * 1.5}" y="${m.y}" dominant-baseline="central" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="${R * 1.15}" fill="#101b2d" stroke="${C.land}" stroke-width="${R * .35}" paint-order="stroke">${esc(m.name)}</text>`;
    s += `<title>${esc(m.name)}</title></g>`;
  });
  if(extra){
    const [ex, ey] = J(extra.lon, extra.lat);
    s += `<circle class="newpin" cx="${ex}" cy="${ey}" r="${R * 1.3}" fill="none" stroke="#c99a3d" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    s += `<circle cx="${ex}" cy="${ey}" r="${R}" fill="#c99a3d" stroke="#101b2d" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    s += `<text x="${ex}" y="${ey}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="${R}" fill="#101b2d">+</text>`;
  }
  s += `</svg>`;
  return `<div class="tripmap" style="aspect-ratio:${aspect}">${s}<span class="mapnote">Mockup map · the real app keeps your Google / OpenStreetMap map</span></div>`;
}

const EXAMPLES = {
  long: 'https://www.google.com/maps/place/Ichiran+Shibuya/@35.6612,139.7016,17z/data=!3m1!4b1!4m6!3m5!1s0x60188ca8b7c0a2a9:0x1!8m2!3d35.6611!4d139.7017',
  shared: 'Ichiran Shibuya\n1F, 1-22-7 Jinnan, Shibuya City, Tokyo 150-0041\nhttps://maps.app.goo.gl/q7XbYz3kLm2N',
  short: 'https://maps.app.goo.gl/q7XbYz3kLm2N',
};
const KNOWN_ADDRESSES = { 'ichiran shibuya': { lat:35.6611, lon:139.7017 } };   // stands in for one Geocoding call
function parseMaps(text){
  const t = (text || '').trim();
  if(!t) return { kind:'empty' };
  const num = '(-?\\d{1,3}\\.\\d+)';
  let m = t.match(new RegExp('!3d' + num + '!4d' + num)) || t.match(new RegExp('@' + num + ',' + num)) || t.match(new RegExp('[?&](?:q|query|ll|destination|center)=' + num + ',\\s*' + num)) || t.match(new RegExp('^' + num + ',\\s*' + num + '$'));
  const nameM = t.match(/\/maps\/place\/([^/@?]+)/);
  const name = nameM ? decodeURIComponent(nameM[1].replace(/\+/g, ' ')) : '';
  if(m) return { kind:'coords', lat:+m[1], lon:+m[2], name: name || 'Dropped pin' };
  const lines = t.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const urls = lines.filter(l => /^https?:\/\//.test(l));
  const words = lines.filter(l => !/^https?:\/\//.test(l) && !/[★☆]/.test(l));
  if(words.length){
    const nm = words[0], addr = words.slice(1).join(', ');
    const hit = KNOWN_ADDRESSES[nm.toLowerCase()];
    return { kind:'text', name:nm, addr, lat: hit && hit.lat, lon: hit && hit.lon };
  }
  if(urls.some(u => /goo\.gl|g\.co\/kgs/.test(u))) return { kind:'short' };
  if(name) return { kind:'text', name, addr:'' };
  return { kind:'unknown' };
}
function linkResultHTML(){

function draftPreview(){
  const d = S.draft; const m = catOf(d.cat).mode;
  if(m === 'nights'){
    const tot = parseFloat(d.total), n = parseInt(d.nights);
    if(!(tot > 0)) return { empty:true, big:'Enter the total and number of nights' };
    if(!(n > 0)) return { big: fmt(d.cur, tot), sub:'Add the number of nights to see the price per night' };
    return { big: `${fmt(d.cur, tot / n)} per night`, sub: `${fmt(d.cur, tot)} for ${n} ${n === 1 ? 'night' : 'nights'}${d.cur !== 'SGD' ? ` · ≈ ${fmt('SGD', toSGD(d.cur, tot / n))} per night` : ''}` };
  }
  if(m === 'pax'){
    const u = parseFloat(d.unit), q = parseInt(d.qty);
    if(!(u > 0)) return { empty:true, big:'Enter the price for one person' };
    const qq = q > 0 ? q : 1;
    return { big: `${fmt(d.cur, u * qq)} total`, sub: `${qq} ${qq === 1 ? 'person' : 'people'} × ${fmt(d.cur, u)}${d.cur !== 'SGD' ? ` · ≈ ${fmt('SGD', toSGD(d.cur, u * qq))}` : ''}` };
  }
  const tot = parseFloat(d.total);
  if(!(tot > 0)) return { empty:true, big:'Enter the amount' };
  return { big: fmt(d.cur, tot), sub: d.cur !== 'SGD' ? `≈ ${fmt('SGD', toSGD(d.cur, tot))}` : '' };
}
function calcHTML(){ const p = draftPreview(); return `<div class="calc ${p.empty ? 'empty' : ''}" id="calc" aria-live="polite"><span class="big">${esc(p.big)}</span>${p.sub ? `<span class="sub">${esc(p.sub)}</span>` : ''}</div>`; }
function amountFields(){
  const d = S.draft; const m = catOf(d.cat).mode;

function expenseFormHTML(){

function saveExpense(){
  const d = S.draft; const m = catOf(d.cat).mode;
  const e = { cat:d.cat, desc:d.desc || d.cat, date:d.date, cur:d.cur };
  if(m === 'pax'){ if(!(parseFloat(d.unit) > 0)){ toast('Enter the price for one person.'); return; } e.unit = parseFloat(d.unit); e.qty = parseInt(d.qty) || 1; }

  S.expenses.unshift(e);

function totals(){
  const by = {}; let all = 0;
  S.expenses.forEach(e => { const v = toSGD(e.cur, expTotal(e)); by[e.cat] = (by[e.cat] || 0) + v; all += v; });

}

    mainArea = `<div class="b-ledger"><div><p class="eyebrow">Japan in Autumn · spent so far</p><div class="total">${fmt('SGD', t.all)}</div><p style="color:var(--muted);font-size:.9688rem">In SGD · example rate S$1 = ¥115</p></div>
      ${CATS.filter(c => t.by[c.k]).map(c => `<section class="b-group"><div class="b-group-h"><b><span class="catdot" style="width:12px;height:12px;border-radius:50%;background:${c.color};display:inline-block"></span>${c.ic} ${c.k}</b><span class="mono">${fmt('SGD', t.by[c.k])}</span></div>
        ${S.expenses.filter(e => e.cat === c.k).map(e => `<div class="b-row"><div><b style="font-weight:700">${esc(e.desc)}</b><div class="brk">${esc(breakdown(e)) || dateShort(e.date)}</div></div><div class="r">${fmt(e.cur, expTotal(e))}${e.cur !== 'SGD' ? `<small>${fmt('SGD', toSGD(e.cur, expTotal(e)))}</small>` : ''}</div></div>`).join('')}</section>`).join('')}</div>`;
  }
  return `<div class="vB scr-${S.screen}">${side}<section class="b-panel">${panel}</section><section class="b-main">${mainArea}</section></div>`;
}
function bMap(){
  const pin = currentParsedPin();
  const keep = S.mapMode; if(pin) S.mapMode = 'day';
  const el = document.querySelector('.b-main');
  const asp = el && el.clientWidth && el.clientHeight ? el.clientWidth / el.clientHeight : 1.2;
  const h = tripMap({ aspect: asp, look:'b', extra: pin }).replace('class="tripmap"', 'class="tripmap" ');
  S.mapMode = keep; return h;
}

/* =========================================================
   VARIANT C
   ========================================================= */
function C(){
  const st = stats();
  let head = '', body = '';
  if(S.screen === 'home'){
    const next = st.next;
    const byYear = {};
    TRIPS.filter(t => !t.upcoming).forEach(t => { const y = t.start.slice(0, 4); t.cities.forEach(c => (byYear[y] = byYear[y] || []).push({ c, t })); });
    head = `<p class="eyebrow">Trip Tracker</p><h1>Your travels</h1>`;
    body = `<section class="c-next"><p class="eyebrow">Next trip · in ${daysUntil(next.start)} days</p><h2>${esc(next.name)}</h2><p>${next.dates} · ${next.cities.join(', ')}</p><button type="button" class="btn" data-act="trip" data-id="jp">Open trip</button></section>
      <section class="c-card"><h2 class="c-h2" style="margin-bottom:4px">${st.cities} cities in ${st.countries} countries</h2><p style="color:var(--muted);margin-bottom:12px">● been there &nbsp; ○ coming up &nbsp; ◆ home</p>${worldMap({ look:'c', fit:true })}</section>
      <section><h2 class="c-h2">Cities you've been to</h2>
        ${Object.keys(byYear).sort().reverse().map(y => `<p class="c-year">${y}</p>${byYear[y].map(o => `<div class="c-city"><b>${esc(o.c)}</b><span>${esc(CITIES[o.c][2])} · ${new Date(o.t.start).toLocaleDateString('en-GB', { month:'short' })}</span></div>`).join('')}`).join('')}</section>`;
  } else if(S.screen === 'day'){
    const d = DAYS[S.day]; const items = numbered(d);
    head = `<p class="eyebrow">Japan in Autumn</p><h1>Day ${S.day + 1} · ${esc(d.city)}</h1>`;
    const timed = d.times.map(t => ({ t:t[0], html:esc(t[1]) }));
    d.places.filter(p => p.t === 'flight').forEach(p => { timed.push({ t:p.dep, html:`<span class="flight"><b>✈️ ${esc(p.name)}</b>Departs ${p.dep}, lands ${p.arr}</span>` }); });
    timed.sort((a, b) => a.t.localeCompare(b.t));
    const hotel = d.places.find(p => p.t === 'hotel');
    body = `<div class="c-dates">${DAYS.map((dd, i) => `<button type="button" class="c-date" data-act="day" data-i="${i}" aria-current="${i === S.day}"><small>${dd.dow}</small><b>${dd.dn}</b></button>`).join('')}</div>
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
      <section class="c-map"><button type="button" class="c-maptoggle" data-act="cmap" aria-expanded="${!!S.cMap}"><span>🗺️ ${S.cMap ? 'Hide map' : 'Show today on the map'}</span><span>${S.cMap ? '▴' : '▾'}</span></button>${S.cMap ? tripMap({ aspect: 4/3, look:'c' }) : ''}</section>
      ${timed.length ? `<section><h2 class="c-h2" style="margin-bottom:6px">Timings</h2><ul class="tl">${timed.map(x => `<li><span class="t">${x.t}</span><span>${x.html}</span></li>`).join('')}</ul></section>` : ''}
      ${hotel ? `<div class="c-stay"><span class="ic">🏨</span><div><b>${esc(hotel.name)}</b><small>${esc(hotel.span)} · ${esc(hotel.addr)}</small></div></div>` : ''}
      ${items.some(x => x.n) ? `<section><h2 class="c-h2">Places</h2>${items.filter(x => x.n).map(x => `<div class="c-place"><span class="n" style="background:${DAY_COLORS[S.day % 8]}">${x.n}</span><div><b>${esc(x.p.name)}</b> <span style="color:var(--muted);font-size:1rem">${placeIcon(x.p)}</span>${x.p.addr ? `<div class="addr">${esc(x.p.addr)}</div>` : ''}${x.p.note ? `<div class="note">${esc(x.p.note)}</div>` : ''}</div></div>`).join('')}</section>` : ''}
      <button type="button" class="btn c-wide" data-act="sheet" data-s="place">+ Add a place</button>`;
  } else {
    const t = totals();
    head = `<p class="eyebrow">Japan in Autumn</p><h1>Budget</h1>`;
    body = `<section><p style="color:var(--muted)">Spent so far, in SGD</p><div class="c-total">${fmt('SGD', t.all)}</div></section>
      <button type="button" class="btn brass c-wide" data-act="sheet" data-s="expense">+ Add an expense</button>
      <section class="c-card">${CATS.filter(c => t.by[c.k]).map(c => `<div class="c-cat"><span>${c.ic} ${c.k}</span><span class="mono">${fmt('SGD', t.by[c.k])}</span><span class="track"><span class="fill" style="display:block;width:${(t.by[c.k] / t.all * 100).toFixed(1)}%;background:${c.color}"></span></span></div>`).join('')}</section>
      <section><h2 class="c-h2">Expenses</h2>${S.expenses.map(e => `<div class="c-exp"><div><b>${esc(e.desc)}</b><div class="brk">${esc(breakdown(e)) || esc(e.cat)}</div></div><div class="r">${fmt(e.cur, expTotal(e))}${e.cur !== 'SGD' ? `<small>${fmt('SGD', toSGD(e.cur, expTotal(e)))}</small>` : ''}</div></div>`).join('')}</section>`;
  }
  let sheet = '';
  if(S.sheet === 'place'){
    sheet = `<div class="sheet-wrap" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add a place"><span class="grab"></span>
      <div class="sheet-h"><h2>Add a place</h2><button type="button" class="x" data-act="close" aria-label="Close">✕</button></div>
      ${placeFormHTML()}<div id="sheetmap">${previewMapHTML('c')}</div>
      <button type="button" class="btn brass c-wide" data-act="addplace">Add to day</button></div></div>`;
  } else if(S.sheet === 'expense'){
    const d = S.draft;
    const inner = S.step === 1
      ? `<p class="steps">Step 1 of 2 · What kind of expense?</p><div class="cattiles">${CATS.map(c => `<button type="button" class="cattile" data-act="catstep" data-c="${c.k}" aria-pressed="${d.cat === c.k}"><span class="ic">${c.ic}</span>${c.k}</button>`).join('')}</div>`
      : `<p class="steps">Step 2 of 2 · ${catOf(d.cat).ic} ${d.cat} <button type="button" class="btn small ghost" data-act="step" data-s="1" style="margin-left:8px">Change</button></p>
         <form class="form" data-form="exp" onsubmit="return false">
         ${amountFields()}
         ${calcHTML()}
         <div class="grid2"><div class="field"><label for="fdesc">Description</label><input id="fdesc" class="inp" data-f="desc" value="${esc(d.desc)}" placeholder="${catOf(d.cat).mode === 'nights' ? 'Hotel name' : 'What was it?'}"></div>
         <div class="field"><label for="fdate">Date</label><input id="fdate" type="date" class="inp" data-f="date" value="${esc(d.date)}"></div></div>
         <button type="button" class="btn brass c-wide" data-act="saveexp">Add expense</button></form>`;
    sheet = `<div class="sheet-wrap" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add an expense"><span class="grab"></span>
      <div class="sheet-h"><h2>Add an expense</h2><button type="button" class="x" data-act="close" aria-label="Close">✕</button></div>${inner}</div></div>`;
  }
  const tab = (k, ic, l) => `<button type="button" class="c-tab" data-act="nav" data-to="${k}" ${S.screen === k ? 'aria-current="page"' : ''}><span class="ic">${ic}</span>${l}</button>`;
  return `<div class="vC"><div class="c-col"><header class="c-head">${head}${syncChip()}</header><main class="c-body">${body}</main></div>
    <nav class="c-tabbar"><div class="in">${tab('home','🌏','Home')}${tab('day','📋','Trip')}${tab('budget','💰','Budget')}</div></nav>${sheet}</div>`;
}

/* ===== Switcher + render ===== */
const VARIANTS = { a:{ fn:A, name:'Boarding pass, larger' }, b:{ fn:B, name:'Atlas: map first' }, c:{ fn:C, name:'Journal: one column' } };
const KEYS = Object.keys(VARIANTS);
const app = document.getElementById('app');
function readHash(){ const m = (location.hash || '').match(/^#variant-([abc])$/); if(m) S.variant = m[1]; }
function render(){
  document.documentElement.style.setProperty('--scale', S.scale);
  document.body.classList.toggle('c-active', S.variant === 'c');
  app.innerHTML = VARIANTS[S.variant].fn();
  if(S.variant === 'b' && S.screen === 'day'){ const m = document.getElementById('bmap'); if(m) m.innerHTML = bMap(); }
  document.getElementById('vlabel').innerHTML = `${S.variant.toUpperCase()} <small>(${VARIANTS[S.variant].name})</small>`;
  document.getElementById('szlabel').textContent = Math.round(S.scale * 100) + '%';
  if(S.toast){ const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = S.toast; app.appendChild(t); }
}
let toastTimer;
function toast(msg){ S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; const t = document.querySelector('.toast'); if(t) t.remove(); }, 2600); const old = document.querySelector('.toast'); if(old) old.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg; app.appendChild(t); }
function setVariant(k){ S.variant = k; S.sheet = null; try{ history.replaceState(null, '', '#variant-' + k); }catch(e){ location.hash = 'variant-' + k; } render(); window.scrollTo(0, 0); }
function cycle(dir){ const i = KEYS.indexOf(S.variant); setVariant(KEYS[(i + dir + KEYS.length) % KEYS.length]); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(a === 'closebg' && e.target !== el) return;
  switch(a){
    case 'vprev': cycle(-1); return;
    case 'vnext': cycle(1); return;
    case 'szup': S.scale = Math.min(1.4, +(S.scale + .1).toFixed(1)); break;
    case 'szdown': S.scale = Math.max(.8, +(S.scale - .1).toFixed(1)); break;
    case 'nav': S.screen = el.dataset.to; S.sheet = null; window.scrollTo(0, 0); break;
    case 'trip': if(el.dataset.id === 'jp'){ S.screen = 'day'; S.day = 0; window.scrollTo(0, 0); } else { toast('Opens that trip. Only Japan is filled in for the mockup.'); return; } break;
    case 'day': S.day = +el.dataset.i; S.sheet = null; break;
    case 'dayb': S.screen = 'day'; S.day = +el.dataset.i; S.sheet = null; break;
    case 'mapm': S.mapMode = el.dataset.m; if(S.variant === 'b' && S.sheet === 'place') S.sheet = null; break;
    case 'cmap': S.cMap = !S.cMap; break;
    case 'sync': S.sync = { synced:'syncing', syncing:'offline', offline:'synced' }[S.sync]; break;
    case 'sheet': S.sheet = el.dataset.s; S.step = 1; S.pday = null; break;
    case 'close': case 'closebg': S.sheet = null; break;
    case 'ptab': S.placeTab = el.dataset.t; break;
    case 'ex': S.link = EXAMPLES[el.dataset.k]; break;
    case 'pcat': S.placeCat = el.dataset.c; break;
    case 'pick': S.picked = el.dataset.n; toast(`Selected ${el.dataset.n}`); return;
    case 'addplace': addParsedPlace(); return;
    case 'cat': S.draft.cat = el.dataset.c; break;
    case 'catstep': S.draft.cat = el.dataset.c; S.step = 2; break;
    case 'step': S.step = +el.dataset.s; break;
    case 'saveexp': saveExpense(); return;
    case 'hl': S.hlCity = S.hlCity === el.dataset.c ? null : el.dataset.c; break;
    case 'toast': toast(el.dataset.m); return;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f){
    S.draft[t.dataset.f] = t.value;
    const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML();
  } else if(t.dataset.in === 'link'){
    S.link = t.value;
    const r = document.getElementById('linkres'); if(r) r.innerHTML = linkResultHTML();
    const m = document.getElementById('sheetmap'); if(m) m.innerHTML = previewMapHTML(S.variant);
    const bm = document.getElementById('bmap'); if(bm) bm.innerHTML = bMap();
  } else if(t.dataset.in === 'q'){
    S.q = t.value; const q = S.q.trim().toLowerCase();
    const r = document.getElementById('searchres'); if(r) r.innerHTML = searchResHTML(q.length > 1 ? SEARCH_SAMPLE.filter(p => p.name.toLowerCase().includes(q)) : [], q);
  } else if(t.dataset.in === 'pday'){ S.pday = t.value; }
});
document.addEventListener('change', e => { const t = e.target; if(t.dataset.f === 'cur'){ S.draft.cur = t.value; const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); } if(t.dataset.in === 'pday') S.pday = t.value; });
document.addEventListener('keydown', e => {
  if(e.target.closest('input, textarea, select, [contenteditable]')) return;
  if(e.key === 'ArrowLeft') cycle(-1);
  if(e.key === 'ArrowRight') cycle(1);
  if(e.key === 'Escape' && S.sheet){ S.sheet = null; render(); }
});
window.addEventListener('hashchange', () => { readHash(); render(); });
window.addEventListener('resize', () => { if(S.variant === 'b' && S.screen === 'day'){ const m = document.getElementById('bmap'); if(m) m.innerHTML = bMap(); } });
readHash();
render();
</script>

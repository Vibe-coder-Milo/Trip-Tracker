/* ===== tokens (Atelier, scaffolded) ===== */
:root {

  --color-well: var(--color-paper-2);

  --color-map-sea: oklch(91.5% 0.035 228); --color-map-land: oklch(99.3% 0.004 95); --color-map-edge: oklch(78% 0.025 228);

  --cat-air: oklch(73% 0.12 255); --cat-hotel: oklch(74% 0.12 305); --cat-sight: oklch(74% 0.15 2); --cat-food: oklch(87% 0.14 95); --cat-transport: oklch(76% 0.12 160); --cat-misc: oklch(72% 0.02 255); --cat-activity: oklch(80% 0.1 212);

  --color-card: oklch(23% 0.016 250); --color-card-edge: oklch(34% 0.016 250); --color-pencil: oklch(74% 0.014 250);
  --cat-air: oklch(73% 0.12 255); --cat-hotel: oklch(74% 0.12 305); --cat-sight: oklch(74% 0.15 2); --cat-food: oklch(87% 0.14 95); --cat-transport: oklch(76% 0.12 160); --cat-misc: oklch(72% 0.02 255); --cat-activity: oklch(80% 0.1 212);
  --color-error: oklch(72% 0.16 27); --color-success: oklch(76% 0.13 155); --color-warn: oklch(80% 0.12 75);
  --color-warn-wash: oklch(29% 0.05 75); --color-error-wash: oklch(29% 0.05 27);
  --color-map-sea: oklch(26% 0.035 235); --color-map-land: oklch(36% 0.012 250); --color-map-edge: oklch(46% 0.02 235); --color-map-arc: oklch(76% 0.15 58 / 0.75);
  --color-overlay: oklch(8% 0.01 250 / 0.65);
  --shadow-card: 0 0 0 1px oklch(40% 0.016 250), 0 12px 32px -12px oklch(5% 0 0 / 0.6);
  --color-page: oklch(15% 0.013 250); --color-section: oklch(21% 0.016 250); --section-edge: oklch(31% 0.016 250);
  --section-shadow: none;
  --nextup-bg: var(--color-accent-wash); --nextup-fg: var(--color-ink); --nextup-sub: var(--color-ink-2); --nextup-edge: var(--color-accent);

/* ===== base (scaffolded) ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { font-size: calc(106.25% * var(--scale)); scrollbar-color: var(--color-muted) var(--color-paper); scroll-padding-top: var(--space-3xl); }
body { margin: 0; background: var(--color-page); color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; caret-color: var(--color-accent); }
::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
h1, h2, h3 { margin: 0; font-family: var(--font-body); font-weight: 600; font-synthesis: none; letter-spacing: -0.01em; line-height: 1.2; color: var(--color-ink); overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
h1 { max-width: 24ch; font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--tracking-display); line-height: 1.1; font-size: var(--text-display); } h2 { max-width: 30ch; font-size: var(--text-section); } h3 { max-width: 40ch; font-size: var(--text-title); }
p { margin: 0; text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *:not(.keep-motion), *:not(.keep-motion)::before, *:not(.keep-motion)::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }

/* ===== controls ===== */
.ic { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font-size: var(--text-sm); line-height: 1; white-space: nowrap; cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn::before { content: ""; position: absolute; inset: -2px; }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); font-weight: 500; }
.btn--quiet { border-color: var(--color-edge); color: var(--color-ink-2); }
.btn--danger { border-color: var(--color-edge); color: var(--color-error); }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible, .iconbtn:focus-visible, .seg button:focus-visible, .chip:focus-visible, .row-open:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.btn:active, .iconbtn:active, .seg button:active, .chip:active { transform: translateY(1px); }
.btn:disabled, .iconbtn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; background: transparent; color: var(--color-muted); border-color: var(--color-rule); border-style: dashed; }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--color-ink); color: var(--color-paper); }
  .btn--primary:hover:not(:disabled) { background: var(--color-accent-strong); border-color: var(--color-accent-strong); color: var(--color-accent-ink); }
  .btn--danger:hover:not(:disabled) { background: var(--color-error); color: var(--color-accent-ink); border-color: var(--color-error); }
  .iconbtn:hover:not(:disabled) { background: var(--color-paper-2); color: var(--color-ink); }
  .link:hover { text-decoration-color: var(--color-ink); }
  .tab:hover { color: var(--color-ink); }
  .seg button:hover { color: var(--color-ink); }
  .chip:hover { border-color: var(--color-ink-2); }
}
.iconbtn { position: relative; display: inline-grid; place-items: center; width: var(--control-h); height: var(--control-h); border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--color-muted); cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
.iconbtn::before { content: ""; position: absolute; inset: -2px; }
.link { display: inline-flex; align-items: center; gap: var(--space-2xs); min-height: 44px; padding: 0; border: 0; background: none; color: var(--color-ink); font-size: var(--text-sm); text-decoration: underline; text-decoration-color: var(--color-accent); text-underline-offset: 0.25em; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.field > label, .field > .label { font-size: var(--text-sm); color: var(--color-muted); }
.help { min-height: 1lh; font-size: var(--text-sm); color: var(--color-muted); }
.input { width: 100%; min-height: var(--control-h); padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-muted); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink); outline: 2px solid transparent; outline-offset: -3px; font-size: var(--text-md); transition: background-color var(--dur-short) var(--ease-out); }
.input:focus-visible { outline-color: var(--color-focus); }
@media (hover: hover) { .input:hover { background: var(--color-paper); } }
.input:disabled { opacity: 0.55; cursor: not-allowed; }
.input.num { font-variant-numeric: tabular-nums; }
textarea.input { min-height: 4.5rem; resize: vertical; line-height: 1.5; }
.line { width: 100%; min-height: var(--control-h); padding: var(--space-xs) 0; border: 0; border-bottom: 1px solid var(--color-muted); border-radius: 0; background: transparent; color: var(--color-ink-2); outline: 2px solid transparent; outline-offset: 2px; font-size: var(--text-md); }
.line:focus-visible { outline-color: var(--color-focus); }
.line::placeholder, .input::placeholder { color: var(--color-muted); }
textarea.line { resize: vertical; min-height: var(--control-h); line-height: 1.5; }
.seg { display: inline-flex; gap: var(--space-2xs); padding: var(--space-2xs); border-radius: var(--radius-pill); background: var(--color-paper-2); }
.seg button { min-height: 36px; padding: 0 var(--space-md); border: 1px solid transparent; border-radius: var(--radius-pill); background: transparent; color: var(--color-muted); font-size: var(--text-sm); cursor: pointer; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
.seg button[aria-pressed="true"] { background: var(--color-card); border-color: var(--color-edge); color: var(--color-ink); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.chip { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-md); border: 1px solid var(--color-edge); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink-2); font-size: var(--text-sm); cursor: pointer; transition: border-color var(--dur-short) var(--ease-out); }
.chip[aria-pressed="true"] { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); background: var(--color-accent-wash); color: var(--color-ink); }

/* ===== shell ===== */
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: var(--z-sticky-nav); background: var(--color-bar); border-bottom: 1px solid var(--color-rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: var(--z-sticky-nav); background: var(--color-bar); }
.bar-in { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--bar-h); }
.wordmark { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0; border: 0; background: none; font-family: var(--font-display); font-size: var(--text-lg); color: var(--color-ink); cursor: pointer; white-space: nowrap; }
.wordmark .ic { width: 22px; height: 22px; color: var(--color-accent); }
.tabs { display: flex; gap: var(--space-lg); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--bar-h); padding: 0; border: 0; background: none; color: var(--color-muted); font-size: var(--text-md); white-space: nowrap; cursor: pointer; transition: color var(--dur-short) var(--ease-out); }
.tab[aria-current="page"] { color: var(--color-ink); box-shadow: inset 0 -2px 0 var(--color-accent); }
.tab .today { font-size: var(--text-xs); padding: 0 var(--space-xs); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink); }
.bar-right { display: flex; align-items: center; gap: var(--space-xs); }
.syncbtn { display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 44px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-pill); background: none; color: var(--color-muted); font-size: var(--text-sm); white-space: nowrap; cursor: pointer; }
.syncbtn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.syncbtn[data-s="expiring"], .syncbtn[data-s="offline"] { color: var(--color-warn); }
.syncbtn[data-s="stopped"] { color: var(--color-error); }
@media (hover: hover) { .syncbtn:hover { background: var(--color-paper-2); } }
@media (max-width: 60rem) {
  :root { --gutter: 24px; --bar-h: 56px; }
  .bar-in { flex-wrap: wrap; row-gap: 0; }
  .tabs { order: 3; flex-basis: 100%; }
  .bar-right { margin-left: auto; }
  .syncbtn .synctext { display: none; }
}
@media (max-width: 40rem) { :root { --gutter: 16px; } }
main { padding-block: var(--space-xl) var(--space-4xl); }
.screen { display: flex; flex-direction: column; gap: var(--space-2xl); min-width: 0; }
.screen > *, .bud-top > *, .it-grid > *, .summary > * { min-width: 0; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-md); padding: var(--space-md) var(--space-lg); border-radius: var(--radius-card); background: var(--color-warn-wash); color: var(--color-ink); }
.banner.bad { background: var(--color-error-wash); }
.foot { border-top: 1px solid var(--color-rule); }
.foot-in { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-lg); padding-block: var(--space-lg) var(--space-4xl); font-size: var(--text-sm); color: var(--color-muted); }
.foot-in p { margin-right: auto; }

/* ===== page heads ===== */
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-lg) var(--space-2xl); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--color-ink); }
.titleinput { width: min(100%, 24ch); padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; font-family: var(--font-display); font-weight: var(--display-weight); font-size: var(--text-display); letter-spacing: var(--tracking-display); line-height: 1.15; color: var(--color-ink); outline: 2px solid transparent; outline-offset: 4px; }
.titleinput:focus-visible { outline-color: var(--color-focus); }
@media (hover: hover) { .titleinput:hover { border-bottom-color: var(--color-rule); } }
.meta { display: flex; flex-wrap: wrap; gap: var(--space-md) var(--space-xl); margin: 0; }
.meta div { display: flex; flex-direction: column; }
.meta dt { font-size: var(--text-sm); color: var(--color-muted); }
.meta dd { margin: 0; color: var(--color-ink); font-variant-numeric: tabular-nums; }
@media (max-width: 40rem) { .pagehead { gap: var(--space-sm); padding-bottom: var(--space-md); } .meta { gap: var(--space-lg); } }
.sechead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-sm) var(--space-lg); margin-bottom: var(--space-md); }
.sub { color: var(--color-muted); font-size: var(--text-md); }

/* ===== ruled lists (the timetable family) ===== */
.ruled { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-ink); }
.ruled > li { border-bottom: 1px solid var(--color-rule); }
.empty { padding-block: var(--space-lg); color: var(--color-muted); }

/* ===== home ===== */

}

.pchip { position: relative; display: inline-flex; align-items: center; gap: var(--space-xs); min-height: var(--control-h); padding: 0 var(--space-sm) 0 var(--space-2xs); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-ink); font-size: var(--text-sm); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }

/* ===== itinerary ===== */
.daystrip { display: flex; gap: var(--space-2xs); overflow-x: auto; border-bottom: 1px solid var(--color-rule); scrollbar-width: thin; }

.details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: var(--space-lg); }

@media (max-width: 40rem) { .tt { grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: var(--space-sm); } .tt.editing { grid-template-columns: minmax(0, 1fr) auto; } .tt.editing textarea { grid-column: 1 / -1; grid-row: 2; } }

.item-main { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }

/* ===== budget ===== */

.panel { display: flex; flex-direction: column; gap: var(--space-lg); padding: var(--space-xl); border-radius: var(--radius-card); background: var(--color-card); border: 1px solid var(--color-card-edge); box-shadow: var(--shadow-card); }

.ledger tr.editing td { background: var(--color-drop); }

    if(m.kind === 'hotel') s += `<rect class="tm-pin hotel" x="${m.x - rr}" y="${m.y - rr}" width="${rr * 2}" height="${rr * 2}"/>`;
    else s += `<circle class="tm-pin ${m.kind === 'stop' ? 'c-' + m.cat : m.cur ? 'cur' : ''}" cx="${m.x}" cy="${m.y}" r="${rr}"/>`;
    s += `<text class="tm-num" x="${m.x}" y="${m.y}" text-anchor="middle" dominant-baseline="central" font-size="${R * 1.05}">${m.txt}</text>`;
    if(m.kind === 'city') s += `<text class="tm-lab" x="${m.x > cx ? m.x - R * 1.6 : m.x + R * 1.6}" text-anchor="${m.x > cx ? 'end' : 'start'}" y="${m.y}" dominant-baseline="central" font-size="${R * 1.15}" stroke-width="${R * .4}">${esc(m.label)}</text>`;
    s += `<title>${esc(m.label)}</title></g>`;
  });
  s += `</svg>`;
  return `<div class="tripmap ${picking ? 'picking' : ''}" style="aspect-ratio:${aspect}">${s}</div>`;
}

const EX = {
  short: 'https://maps.app.goo.gl/JJPYF9HCxvhZecEz7?g_st=ic',
  long: 'https://www.google.com/maps/place/Ichiran+Shibuya/@35.6612,139.7016,17z/data=!3m1!4b1!4m6!3m5!1s0x60188ca8b7c0a2a9:0x1!8m2!3d35.6611!4d139.7017',
};
function parseMaps(text){
  const t = (text || '').trim(); if(!t) return { kind:'empty' };
  const num = '(-?\\d{1,3}\\.\\d+)';
  const m = t.match(new RegExp('!3d' + num + '!4d' + num)) || t.match(new RegExp('@' + num + ',' + num)) || t.match(new RegExp('[?&](?:q|query|ll|destination|center)=' + num + ',\\s*' + num));
  const nm = t.match(/\/maps\/place\/([^/@?]+)/);
  const name = nm ? decodeURIComponent(nm[1].replace(/\+/g, ' ')) : 'Pinned place';
  if(m) return { kind:'coords', lat:+m[1], lon:+m[2], name, via:'link' };
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(t)) return S.helperSet ? { kind:'coords', lat:35.6611, lon:139.7017, name:'Ichiran Shibuya', via:'helper' } : { kind:'nohelper' };
  return { kind:'unknown' };
}
function linkResHTML(){
  const r = parseMaps(S.link);
  if(r.kind === 'empty') return `<p class="sub">In Google Maps, tap Share, then Copy link, and paste it here. Short and full links both work.</p>`;
  if(r.kind === 'coords') return `<div class="result ok">${I('check')}<div><b>${esc(r.name)}</b><span class="num">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</span><br><span>${r.via === 'helper' ? 'Your short-link reader opened the link. In the mockup every short link gives this sample place.' : 'The location was read straight from the link.'}</span></div></div>`;
  if(r.kind === 'nohelper') return `<div class="result warn">${I('alert')}<div><b>Short links need the short-link reader</b><span>Set up the short-link reader once in Settings, or search by name for now.</span></div></div>`;
  return `<div class="result warn">${I('alert')}<div><b>This isn't a Google Maps link</b><span>Copy the link from the Share button in Google Maps and paste it here.</span></div></div>`;
}

function nextUp(i){

}

function addPanelHTML(i){

function searchResHTML(){

/* ===== Budget ===== */
function draftPreview(){
  const d = S.draft; const m = catOf(d.cat).mode; const tb = TRIP.base;
  if(m === 'nights'){ const tot = parseFloat(d.total), n = parseInt(d.nights); if(!(tot > 0)) return { empty:true, big:'Enter the total and the number of nights' }; if(!(n > 0)) return { big:fmt(d.cur, tot), small:'Add the number of nights to see the price per night' }; return { big:`${fmt(d.cur, tot / n)} a night`, small:`${fmt(d.cur, tot)} for ${n} ${n === 1 ? 'night' : 'nights'}${d.cur !== tb ? `${isFinite(conv(d.cur, tb, 1)) ? `, about ${fmt(tb, conv(d.cur, tb, tot / n))} a night` : `. Add a ${d.cur} rate to see it in ${tb}`}` : ''}` }; }
  if(m === 'pax'){ const u = parseFloat(d.unit), q = parseInt(d.qty); if(!(u > 0)) return { empty:true, big:'Enter the price for one person and how many people' }; if(!(q > 0)) return { big:`${fmt(d.cur, u)} each`, small:'Add how many people to see the total' }; const sg = conv(d.cur, tb, u * q); return { big:`${fmt(d.cur, u * q)} in all`, small:`${q} ${q === 1 ? 'person' : 'people'} × ${fmt(d.cur, u)}${d.cur !== tb ? (isFinite(sg) ? `, about ${fmt(tb, sg)}` : `. Add a ${d.cur} rate to see it in ${tb}`) : ''}` }; }
  const tot = parseFloat(d.total); if(!(tot > 0)) return { empty:true, big:'Enter the amount' }; return { big:fmt(d.cur, tot), small:d.cur !== tb ? (isFinite(conv(d.cur, tb, tot)) ? `About ${fmt(tb, conv(d.cur, tb, tot))}` : `Add a ${d.cur} rate to see it in ${tb}`) : '' };
}
function calcHTML(){ const p = draftPreview(); return `<div class="calc ${p.empty ? 'empty' : ''}" id="calc" aria-live="polite"><span class="big">${esc(p.big)}</span>${p.small ? `<span class="small">${esc(p.small)}</span>` : ''}</div>`; }
function scrBudget(){
  const t = totals(); const d = S.draft; const m = catOf(d.cat).mode; const editing = S.editing ? EXPENSES.find(e => e.id === S.editing) : null;
  const used = [...new Set([TRIP.base, TRIP.localCur, ...EXPENSES.map(e => e.cur)])];
  const opt = (c, val) => `<option value="${c}" ${c === val ? 'selected' : ''}>${c}, ${esc(CUR_NAMES[c] || c)}</option>`;
  const curSel = (id, val, attr) => `<select id="${id}" class="input" ${attr}><optgroup label="On this trip">${used.map(c => opt(c, val)).join('')}</optgroup><optgroup label="All currencies">${CURS.filter(c => !used.includes(c)).map(c => opt(c, val)).join('')}</optgroup></select>`;
  const amount = m === 'nights'
    ? `<div class="grid3"><div class="field"><label for="ftotal">Total for the stay</label><input id="ftotal" class="input num" ${S.expErr && S.expErr.f === 'ftotal' ? 'aria-invalid="true" aria-describedby="experr"' : ''} inputmode="decimal" data-f="total" value="${esc(d.total)}" ></div><div class="field"><label for="fnights">Nights</label><input id="fnights" class="input num" ${S.expErr && S.expErr.f === 'fnights' ? 'aria-invalid="true" aria-describedby="experr"' : ''} inputmode="numeric" data-f="nights" value="${esc(d.nights)}" ></div><div class="field"><label for="fcur">Currency</label>${curSel('fcur', d.cur, 'data-f="cur"')}</div></div>`
    : m === 'pax'
    ? `<div class="grid3"><div class="field"><label for="funit">Price for one person</label><input id="funit" class="input num" ${S.expErr && S.expErr.f === 'funit' ? 'aria-invalid="true" aria-describedby="experr"' : ''} inputmode="decimal" data-f="unit" value="${esc(d.unit)}" ></div><div class="field"><label for="fqty">People</label><input id="fqty" class="input num" ${S.expErr && S.expErr.f === 'fqty' ? 'aria-invalid="true" aria-describedby="experr"' : ''} inputmode="numeric" data-f="qty" value="${esc(d.qty)}" ></div><div class="field"><label for="fcur">Currency</label>${curSel('fcur', d.cur, 'data-f="cur"')}</div></div>`
    : `<div class="grid2"><div class="field"><label for="ftotal">Amount</label><input id="ftotal" class="input num" ${S.expErr && S.expErr.f === 'ftotal' ? 'aria-invalid="true" aria-describedby="experr"' : ''} inputmode="decimal" data-f="total" value="${esc(d.total)}" ></div><div class="field"><label for="fcur">Currency</label>${curSel('fcur', d.cur, 'data-f="cur"')}</div></div>`;
  const rows = [...EXPENSES].sort((a, b) => a.date.localeCompare(b.date)).map(e => `<tr class="${S.editing === e.id ? 'editing' : ''}"><td class="num">${dShort(e.date)}</td><td class="what"><b>${esc(e.desc)}</b><span><span class="cat-ic c-${CATKEY[e.cat]}">${I(catOf(e.cat).ic,'sm')}</span>${e.cat}</span></td><td class="brk">${esc(breakdown(e))}</td><td class="r">${fmt(e.cur, expTotal(e))}</td><td class="r">${fmt(TRIP.base, conv(e.cur, TRIP.base, expTotal(e)))}</td>
    <td><span class="acts"><button type="button" class="btn btn--quiet" data-act="editexp" data-id="${e.id}">Edit</button><button type="button" class="iconbtn" data-act="delexp" data-id="${e.id}" aria-label="Delete ${esc(e.desc)}">${I('x')}</button></span></td></tr>`).join('');
  return `<div class="screen">${syncBanner()}${pageHead()}
    <div class="bud-top">
      <section class="box" aria-labelledby="h-tot" style="display:flex;flex-direction:column;gap:var(--space-lg)"><div><h2 id="h-tot" class="visually-hidden">Total</h2><p class="sub">Spent so far, in ${TRIP.base}</p><p class="figure">${fmt(TRIP.base, t.all)}</p><p class="sub">${rateLine()}</p>${t.left ? `<p class="formerr">${I('alert','sm')}${t.left} ${t.left === 1 ? 'expense is' : 'expenses are'} left out until you add a rate for ${t.missing.join(' and ')}.</p>` : ''}</div>
        <dl class="bars">${CATS.filter(c => t.by[c.k]).map(c => `<dt><span class="cat-ic c-${CATKEY[c.k]}">${I(c.ic,'sm')}</span>${c.k}</dt><dd><span class="track"><span class="fill c-${CATKEY[c.k]}" style="width:${(t.by[c.k] / t.all * 100).toFixed(1)}%"></span></span></dd><dd class="v">${fmt(TRIP.base, t.by[c.k])}</dd>`).join('')}</dl>
        <div class="grid2"><div class="field"><label for="lcur">Local currency</label>${curSel('lcur', TRIP.localCur, 'data-in="lcur" aria-describedby="lcur-help"')}<span class="help" id="lcur-help">New expenses start in it</span></div><div class="field"><label for="bcur">Show totals in</label>${curSel('bcur', TRIP.base, 'data-in="bcur"')}</div></div>
        <fieldset class="rates"><legend>Exchange rate for this trip</legend><p class="sub">Set it once, for example from your money changer. Every total on this trip uses it; nothing changes with live rates.</p>

      <section class="panel" aria-labelledby="h-add"><div class="dialog-h"><h2 id="h-add">${editing ? 'Edit the expense' : 'Add an expense'}</h2>${editing ? '<button type="button" class="link" data-act="canceledit">Cancel</button>' : ''}</div>
        <form class="plan" style="gap:var(--space-md)" onsubmit="return false" data-form="exp">
          <div class="field"><span class="label" id="lbl-ecat">Category</span><div class="chips" role="group" aria-labelledby="lbl-ecat">${CATS.map(c => `<button type="button" class="chip" data-act="cat" data-c="${c.k}" aria-pressed="${d.cat === c.k}"><span class="cat-ic c-${CATKEY[c.k]}">${I(c.ic,'sm')}</span>${c.k}</button>`).join('')}</div></div>

          <div class="chips"><button type="button" class="btn btn--primary" data-act="saveexp">${editing ? 'Save the changes' : 'Add the expense'}</button>${editing ? `<button type="button" class="btn btn--danger" data-act="delexp" data-id="${editing.id}">Delete it</button>` : ''}</div></form></section>
    </div>
    <section class="box" aria-labelledby="h-led"><div class="sechead"><h2 id="h-led">${I('receipt')}All expenses</h2><span class="sub">Oldest first</span></div>

}

/* ===== actions ===== */
function addPlace(){
  const t = S.addType; const di = S.addDay != null ? S.addDay : S.day;
  if(t === 'do' || t === 'move'){
    if(!S.sWhat.trim()){ S.addErr = t === 'do' ? 'Say what the activity is first.' : 'Add the route or details first.'; render(); return; }
    TRIP.days[di].times.push({ t:S.sTime, d:S.sWhat.trim(), kind: t === 'do' ? 'activity' : 'transport' });
    announce(`Added ${S.sWhat.trim()} to Day ${di + 1}`); S.sTime = ''; S.sWhat = '';
  } else if(t === 'flight'){
    if(!S.fName.trim()){ S.addErr = 'Enter the flight name or number first.'; render(); return; }
    TRIP.days[di].places.unshift(P({ type:'flight', name:S.fName.trim(), dep:S.fDep || 'not set', arr:S.fArr || 'not set', note:S.addNote }));
    announce(`Added ${S.fName.trim()} to Day ${di + 1}`); S.fName = S.fDep = S.fArr = '';
  } else {
    let found = null;
    if(S.addMode === 'search'){ found = SEARCH.find(s => s.name === S.picked); if(!found){ S.addErr = 'Pick a result from the list so the place lands on the map.'; render(); return; } }
    else { const r = parseMaps(S.link); if(r.kind !== 'coords'){ S.addErr = 'Paste a Google Maps link that shows a location first.'; render(); return; } found = { name:r.name, addr:'Added from a Google Maps link', lat:r.lat, lon:r.lon }; }
    if(t === 'hotel'){
      const a = S.hFrom ?? di, b = S.hTo ?? di; const lo = Math.min(a, b), hi = Math.max(a, b);
      for(let j = lo; j <= hi; j++) TRIP.days[j].places.splice(TRIP.days[j].places.filter(p => p.type === 'flight').length, 0, P({ type:'hotel', name:found.name, addr:found.addr, lat:found.lat, lon:found.lon, note:S.addNote }));
      announce(`Added ${found.name} to ${dayList(Array.from({ length:hi - lo + 1 }, (_, k) => lo + k + 1))}`);
    } else {
      TRIP.days[di].places.push(act(S.addCat, found.name, found.addr, found.lat, found.lon, S.addNote));
      announce(`Added ${found.name} to Day ${di + 1}`);
    }
    S.q = ''; S.picked = null; S.link = '';
  }
  S.addErr = null; S.addNote = ''; S.wiki = null; S.dialog = null; S.day = di; render();
}
function saveExpense(){
  const d = S.draft; const m = catOf(d.cat).mode;
  const e = S.editing ? EXPENSES.find(x => x.id === S.editing) : { id:uid() };
  const o = { cat:d.cat, desc:d.desc || d.cat, date:d.date, cur:d.cur };
  if(m === 'pax'){ if(!(parseFloat(d.unit) > 0)){ S.expErr = { f:'funit', msg:'Enter the price for one person, then add the expense.' }; render(); document.getElementById('funit')?.focus(); return; } if(!(parseInt(d.qty) > 0)){ S.expErr = { f:'fqty', msg:'Enter how many people, then add the expense.' }; render(); document.getElementById('fqty')?.focus(); return; } Object.assign(o, { unit:parseFloat(d.unit), qty:parseInt(d.qty), total:undefined, nights:undefined }); }
  else { if(!(parseFloat(d.total) > 0)){ S.expErr = { f:'ftotal', msg:m === 'nights' ? 'Enter the total for the stay, then add the expense.' : 'Enter the amount, then add the expense.' }; render(); document.getElementById('ftotal')?.focus(); return; } Object.assign(o, { total:parseFloat(d.total), nights:m === 'nights' ? (parseInt(d.nights) || null) : undefined, unit:undefined, qty:undefined }); }

    case 'canceledit': S.editing = null; S.draft = { ...S.draft, desc:'', total:'', nights:'', unit:'' }; break;
    case 'delexp': { const i = EXPENSES.findIndex(y => y.id === el.dataset.id); const x = EXPENSES[i]; EXPENSES.splice(i, 1); if(S.editing === x.id) S.editing = null; undoToast(`Deleted ${x.desc}`, () => EXPENSES.splice(i, 0, x)); } break;
    default: return;
  }
  render();
});
document.addEventListener('input', e => {
  const t = e.target; const d = TRIP.days[S.day];
  if(t.dataset.f){ S.draft[t.dataset.f] = t.value; if(S.expErr && t.id === S.expErr.f){ S.expErr = null; t.removeAttribute('aria-invalid'); document.getElementById('experr')?.remove(); } const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  if(t.dataset.pf){ S.pastForm[t.dataset.pf] = t.value; if(t.dataset.pf === 'cities') document.getElementById('pcheck').innerHTML = pastCheckHTML(t.value.split(',').map(s => s.trim()).filter(Boolean)); return; }
  switch(t.dataset.in){
    case 'tripname': TRIP.name = t.value; break;
    case 'dcity': d.city = t.value; break;
    case 'dnotes': d.notes = t.value; break;
    case 'ttime': d.times[+t.dataset.k].t = t.value; break;
    case 'tdesc': d.times[+t.dataset.k].d = t.value; break;
    case 'pnote': findPlace(t.dataset.id).p.note = t.value; break;
    case 'ptime': findPlace(t.dataset.id).p.time = t.value; break;
    case 'aq': S.q = t.value; S.picked = null; document.getElementById('ares').innerHTML = searchResHTML(); break;
    case 'alink': S.link = t.value; document.getElementById('alinkres').innerHTML = linkResHTML(); break;
    case 'fname': S.fName = t.value; break;
    case 'swhat': S.sWhat = t.value; break;
    case 'anote': S.addNote = t.value; break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.f === 'cur'){ S.draft.cur = t.value; const c = document.getElementById('calc'); if(c) c.outerHTML = calcHTML(); return; }
  switch(t.dataset.in){
    case 'ddate': TRIP.days[S.day].date = t.value; render(); break;
    case 'fdep': S.fDep = t.value; break;
    case 'stime': S.sTime = t.value; break;
    case 'farr': S.fArr = t.value; break;
    case 'aday': S.addDay = +t.value; break;
    case 'hfrom': S.hFrom = +t.value; break;
    case 'hto': S.hTo = +t.value; break;
    case 'lcur': TRIP.localCur = t.value; S.draft.cur = t.value; render(); break;
    case 'bcur': changeBase(t.value); render(); break;
    case 'accent': S.accent = t.value; if(!isDark()) S.theme = 'dark'; render(); break;
    default: if(t.dataset.rate){ const v = parseFloat(t.value); if(v > 0) TRIP.rates[t.dataset.rate] = v; else delete TRIP.rates[t.dataset.rate]; render(); } break;
    case 'findplace': S.mapFocus = t.value || null; S.mapPopup = t.value || null; render(); break;
    case 'movestep': { const from = TRIP.days[S.day]; const [x] = from.times.splice(+t.dataset.k, 1); TRIP.days[+t.value].times.push(x); S.editTime = null; announce(`Moved ${x.d} to Day ${+t.value + 1}`); render(); } break;
    case 'moveto': { const f = findPlace(t.dataset.id); const to = +t.value; f.d.places.splice(f.i, 1); TRIP.days[to].places.push(f.p); announce(`Moved ${f.p.name} to Day ${to + 1}`); render(); } break;
  }
});
document.addEventListener('toggle', e => { if(e.target.dataset && e.target.dataset.tg === 'details') S.openDetails = e.target.open; }, true);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && (S.dialog || S.picking)){ S.dialog = null; S.picking = null; render(); } });

/* ===== drag and drop (touch and mouse) ===== */
let drag = null;
function moveItem(what, fromDay, fromIdx, toDay, toIdx){
  const key = what === 's' ? 'times' : 'places';
  const src = TRIP.days[fromDay][key]; const [x] = src.splice(fromIdx, 1); const dst = TRIP.days[toDay][key];
  let at = toIdx == null ? dst.length : toIdx; if(fromDay === toDay && fromIdx < at) at -= 1;
  dst.splice(Math.max(0, Math.min(at, dst.length)), 0, x);
  const name = what === 's' ? x.d : x.name;
  announce(fromDay === toDay ? `Moved ${name}` : `Moved ${name} to Day ${toDay + 1}`);
  render();
}
function clearMarks(){ document.querySelectorAll('.drop,.before,.after').forEach(n => n.classList.remove('drop', 'before', 'after')); }
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if(!h) return;
  const kind = h.dataset.drag; const srcEl = kind === 'ov' ? h.closest('.ovrow') : h.closest('.item');
  drag = { kind, what:h.dataset.what || 'p', day:+h.dataset.day, idx:+h.dataset.idx, x:e.clientX, y:e.clientY, started:false, srcEl, ghost:null, target:null };
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.started){ if(Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.started = true;
    const r = drag.srcEl.getBoundingClientRect(); const g = drag.srcEl.cloneNode(true); g.classList.add('dragghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; document.body.appendChild(g);
    drag.ghost = g; drag.ox = drag.x - r.left; drag.oy = drag.y - r.top; drag.srcEl.classList.add('src'); }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px'; drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  const edge = 80; if(e.clientY < edge) window.scrollBy(0, -14); else if(e.clientY > innerHeight - edge) window.scrollBy(0, 14);
  clearMarks(); drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = ''; drag.target = null;
  if(!under) return;
  const sel = drag.kind === 'ov' ? '.ovrow[data-row]' : '.item[data-drag-item]';
  const rowEl = under.closest(sel); const dayEl = drag.kind === 'ov' ? under.closest('.ov-day') : null;
  if(rowEl && rowEl !== drag.srcEl){
    const [what, dd, ii] = (rowEl.dataset.row || rowEl.dataset.dragItem).split(':'); const r = rowEl.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
    rowEl.classList.add(before ? 'before' : 'after');
    drag.target = what === drag.what ? { day:+dd, idx:+ii + (before ? 0 : 1) } : { day:+dd, idx:null };
  } else if(dayEl){ dayEl.classList.add('drop'); drag.target = { day:+dayEl.dataset.day, idx:null }; }
}, { passive:false });
document.addEventListener('pointerup', () => {
  if(!drag) return; const d = drag; drag = null;
  if(!d.started) return;
  d.ghost.remove(); clearMarks(); d.srcEl.classList.remove('src');
  if(d.target && !(d.target.day === d.day && (d.target.idx === d.idx || d.target.idx === d.idx + 1 || d.target.idx === null))) moveItem(d.what, d.day, d.idx, d.target.day, d.target.idx);
});
document.addEventListener('pointercancel', () => { if(drag){ drag.ghost?.remove(); clearMarks(); drag.srcEl.classList.remove('src'); drag = null; } });

render();
</script>
